# Local PostgreSQL for Matriz (ADR-007 decision 5). Start it with `docker compose up -d --wait`.
# The user and password come from .env, copied from .env.example; there are no defaults.
name: matriz

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: matriz
      POSTGRES_USER: ${MATRIZ_DB_USER:?set MATRIZ_DB_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${MATRIZ_DB_PASSWORD:?set MATRIZ_DB_PASSWORD in .env (see .env.example)}
    ports:
      # Changed 2026-11-12, team delivery decision 18: previously fixed at host port 5432.
      - "127.0.0.1:${MATRIZ_DB_PORT:-5432}:5432"
    volumes:
      - matriz-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d matriz"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MATRIZ_DB_URL: jdbc:postgresql://postgres:5432/matriz
      MATRIZ_DB_USER: ${MATRIZ_DB_USER:?set MATRIZ_DB_USER in .env (see .env.example)}
      MATRIZ_DB_PASSWORD: ${MATRIZ_DB_PASSWORD:?set MATRIZ_DB_PASSWORD in .env (see .env.example)}
      MATRIZ_JWT_SIGNING_KEY: ${MATRIZ_JWT_SIGNING_KEY:?set MATRIZ_JWT_SIGNING_KEY in .env (see .env.example)}
      MATRIZ_DEMO_DATA: ${MATRIZ_DEMO_DATA:-false}
      MATRIZ_DEMO_PASSWORD_ANA: ${MATRIZ_DEMO_PASSWORD_ANA:-}
      MATRIZ_DEMO_PASSWORD_RUI: ${MATRIZ_DEMO_PASSWORD_RUI:-}
      MATRIZ_DEMO_PASSWORD_EVA: ${MATRIZ_DEMO_PASSWORD_EVA:-}
      MATRIZ_DEMO_PASSWORD_DANIEL: ${MATRIZ_DEMO_PASSWORD_DANIEL:-}
    ports:
      - "127.0.0.1:${MATRIZ_APP_PORT:-18089}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  matriz-db:
