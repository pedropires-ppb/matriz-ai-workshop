openapi: 3.1.0
info:
  title: Matriz API — draft contract (pending validation)
  version: 0.2.0-draft
  summary: Draft contract for the proposed MVP as extended by the team decisions of 2026-10-29; not client-approved (OQ-016).
  description: |
    **Status: DRAFT — pending client validation; not an approved contract.**
    The client has not approved the proposed MVP scope
    ([OQ-016](docs/constraints.md#open-questions)). Only the needs F01–F03
    are confirmed. This version is aligned with the provisional decisions
    taken by the project team on 2026-10-29
    ([ADR-002](docs/adr/ADR-002-phase-scope-and-implementation-authorization.md);
    [interim team answers](docs/constraints.md#interim-team-answers-2026-10-29)),
    which extend the proposed MVP to FR-001–FR-025. They are team decisions,
    not client approvals: every rule here still rests on proposed
    requirements and on unvalidated assumptions in the
    [assumption register](docs/constraints.md#assumptions). If this contract
    conflicts with the specification in `docs/`, the specification prevails
    and the conflict must be flagged.

    Behaviour that no cited requirement, assumption, or ADR states is a
    proposal of this draft by the AI assistant, pending the team's review,
    even where it is not marked as such.

    **Scope.** Every operation of the proposed MVP. Paths are relative to the
    base path `/api` (see `servers`).

    | Operation | Request | Requirements | User stories |
    |---|---|---|---|
    | `signIn` | `POST /session` | [FR-013](docs/requirements.md#functional-requirements) | [US-013](docs/user-stories.md#stories) |
    | `signOut` | `DELETE /session` | [FR-014](docs/requirements.md#functional-requirements) | [US-014](docs/user-stories.md#stories) |
    | `getCurrentPerson` | `GET /me` | [FR-015](docs/requirements.md#functional-requirements) | [US-015](docs/user-stories.md#stories) |
    | `listProjects` | `GET /projects` | [FR-001](docs/requirements.md#functional-requirements), [FR-022](docs/requirements.md#functional-requirements), [FR-024](docs/requirements.md#functional-requirements) | [US-007](docs/user-stories.md#stories), [US-023](docs/user-stories.md#stories), [US-025](docs/user-stories.md#stories) |
    | `createProject` | `POST /projects` | [FR-002](docs/requirements.md#functional-requirements) | [US-001](docs/user-stories.md#stories) |
    | `getProject` | `GET /projects/{projectId}` | [FR-001](docs/requirements.md#functional-requirements), [FR-012](docs/requirements.md#functional-requirements) | [US-006](docs/user-stories.md#stories), [US-007](docs/user-stories.md#stories) |
    | `updateProject` | `PATCH /projects/{projectId}` | [FR-003](docs/requirements.md#functional-requirements) | [US-008](docs/user-stories.md#stories) |
    | `deleteProject` | `DELETE /projects/{projectId}` | [FR-016](docs/requirements.md#functional-requirements) | [US-016](docs/user-stories.md#stories) |
    | `completeProject` | `PUT /projects/{projectId}/state` | [FR-007](docs/requirements.md#functional-requirements) | [US-010](docs/user-stories.md#stories) |
    | `listProjectMembers` | `GET /projects/{projectId}/members` | [FR-025](docs/requirements.md#functional-requirements) | [US-026](docs/user-stories.md#stories) |
    | `listEligibleParticipants` | `GET /projects/{projectId}/eligible-participants` | [FR-004](docs/requirements.md#functional-requirements) | [US-002](docs/user-stories.md#stories) |
    | `addParticipant` | `POST /projects/{projectId}/members` | [FR-004](docs/requirements.md#functional-requirements) | [US-002](docs/user-stories.md#stories) |
    | `removeParticipant` | `DELETE /projects/{projectId}/members/{personId}` | [FR-005](docs/requirements.md#functional-requirements) | [US-009](docs/user-stories.md#stories) |
    | `listTasks` | `GET /projects/{projectId}/tasks` | [FR-006](docs/requirements.md#functional-requirements), [FR-023](docs/requirements.md#functional-requirements) | [US-004](docs/user-stories.md#stories), [US-024](docs/user-stories.md#stories) |
    | `createTask` | `POST /projects/{projectId}/tasks` | [FR-008](docs/requirements.md#functional-requirements), [FR-018](docs/requirements.md#functional-requirements) | [US-003](docs/user-stories.md#stories), [US-018](docs/user-stories.md#stories) |
    | `getTask` | `GET /projects/{projectId}/tasks/{taskId}` | [FR-006](docs/requirements.md#functional-requirements) | [US-004](docs/user-stories.md#stories) |
    | `updateTask` | `PATCH /projects/{projectId}/tasks/{taskId}` | [FR-009](docs/requirements.md#functional-requirements), [FR-018](docs/requirements.md#functional-requirements) | [US-011](docs/user-stories.md#stories), [US-018](docs/user-stories.md#stories) |
    | `deleteTask` | `DELETE /projects/{projectId}/tasks/{taskId}` | [FR-017](docs/requirements.md#functional-requirements) | [US-017](docs/user-stories.md#stories) |
    | `changeTaskState` | `PUT /projects/{projectId}/tasks/{taskId}/state` | [FR-011](docs/requirements.md#functional-requirements) | [US-005](docs/user-stories.md#stories) |
    | `assignTask` | `POST /projects/{projectId}/tasks/{taskId}/assignees` | [FR-010](docs/requirements.md#functional-requirements), [FR-019](docs/requirements.md#functional-requirements) | [US-012](docs/user-stories.md#stories), [US-020](docs/user-stories.md#stories) |
    | `unassignTask` | `DELETE /projects/{projectId}/tasks/{taskId}/assignees/{personId}` | [FR-010](docs/requirements.md#functional-requirements), [FR-019](docs/requirements.md#functional-requirements) | [US-019](docs/user-stories.md#stories), [US-020](docs/user-stories.md#stories) |
    | `listTaskComments` | `GET /projects/{projectId}/tasks/{taskId}/comments` | [FR-021](docs/requirements.md#functional-requirements) | [US-022](docs/user-stories.md#stories) |
    | `addTaskComment` | `POST /projects/{projectId}/tasks/{taskId}/comments` | [FR-020](docs/requirements.md#functional-requirements) | [US-021](docs/user-stories.md#stories) |

    Nothing [outside the initial scope](docs/requirements.md#outside-the-initial-scope)
    is specified: there is no registration, password recovery, restore of
    deleted items, comment editing or deletion, or notification.

    **Not decided by this draft.** The REST/JSON API as the single entry
    point used by the web client, served under the base path `/api` on the
    same origin as the web client, is a provisional team decision
    ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md)); this file
    is its contract. The architectural style
    ([ADR-001](docs/adr/ADR-001-modular-monolith.md)) and the technology
    stack ([ADR-003](docs/adr/ADR-003-technology-stack.md)) are provisional
    team decisions as well; this contract does not depend on them. Hosting
    is open ([OQ-020](docs/constraints.md#open-questions)), so the server
    URL is relative and no host is given. The JSON representations and the
    error format are proposals of this draft. Identifiers and attributes
    correspond to the [proposed data model](docs/database.md#entities),
    itself pending validation.

    **Identity.** Every operation except `signIn` requires the person's
    identity to be established first
    ([NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
    [Assumption A-014](docs/constraints.md#assumptions),
    [Assumption A-016](docs/constraints.md#assumptions)). As a provisional
    team decision ([ADR-005](docs/adr/ADR-005-authentication-with-jwt.md)),
    `signIn` exchanges the login name and password of a prepared account for
    a signed JWT access token, which the client sends with every other
    request as `Authorization: Bearer <token>` (security scheme
    `bearerAuth`). After `signOut`, the presented token is no longer
    accepted. A missing, malformed, invalid, expired, or revoked token
    receives `401` with a `WWW-Authenticate: Bearer` challenge (RFC 6750);
    nothing is disclosed or changed
    ([EX-012](docs/user-stories.md#edge-cases-and-exceptions)). The server
    takes the acting person only from the token, never from the request: no
    request schema has an owner or author property, and one sent anyway
    receives `422` like any unknown property; query parameters and headers
    never set the identity
    ([ADR-009](docs/adr/ADR-009-identity-from-the-token.md), decision 2;
    added on 2026-11-02 by team decision, Lab Worksheet 03, question 15).
    How identity will finally be established is open
    ([OQ-018](docs/constraints.md#open-questions)).

    **Token life cycle.** *Added on 2026-11-02 by team decision (Lab
    Worksheet 03, questions 2–6, 9, 10, 12, 14, and 17); previously “The token
    lifetime, password rules, and the response to repeated failed attempts
    are open (OQ-027)”.* These are the team's provisional answers to
    [OQ-027](docs/constraints.md#open-questions), recorded in
    [ADR-005](docs/adr/ADR-005-authentication-with-jwt.md#open-points); the
    client's answer prevails.
    1. *Sign-in.* `signIn` checks the login name, ignoring letter case, and
       the password of a prepared account. It returns a new access token,
       `expiresIn` (the token's lifetime in seconds: 28800, that is,
       8 hours), and the signed-in person. A wrong password and an unknown
       login name receive the same `401`. No limit applies to failed
       attempts.
    2. *Use.* The client keeps the token and sends it with every other
       operation as `Authorization: Bearer <token>`. It treats the token as
       opaque. Using the token does not extend it, and no idle timeout
       applies.
    3. *Expiry.* The token is refused from `expiresIn` seconds after it was
       issued, with no clock tolerance. There is no refresh token and no
       renewal operation: the person signs in again.
    4. *Sign-out.* `signOut` ends only the presented token. That token stays
       refused until it would have expired, also after the server restarts.
       Other tokens of the same person are not affected. Replacing the
       server's signing key ends every token.
    5. *Refusal.* Any operation except `signIn`, sent with no token or with
       a token that is malformed, altered, signed with another key, expired,
       or ended, receives `401` with problem details and a
       `WWW-Authenticate` challenge: `Bearer` when no token was sent, and
       `Bearer error="invalid_token"` otherwise. The token is checked before
       anything else, so this `401` comes before `405` and `404`. The User
       interface then discards the token and asks the person to sign in
       again ([ADR-009](docs/adr/ADR-009-identity-from-the-token.md),
       decision 1).

    **Access.** Project membership and role permissions apply to every
    request
    ([NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
    [Assumption A-001](docs/constraints.md#assumptions),
    [Assumption A-002](docs/constraints.md#assumptions);
    [permission matrix](docs/requirements.md#permission-matrix-proposed)). A
    person who is not a member of a project receives `404`, exactly as if
    the project did not exist, so neither the project nor its members, tasks,
    or comments are disclosed
    ([EX-003](docs/user-stories.md#edge-cases-and-exceptions)). Deleted
    projects and tasks receive `404` for everyone, exactly as if they did not
    exist, and are excluded from every list, count, progress value, and
    completion check ([Assumption A-022](docs/constraints.md#assumptions);
    [OQ-023](docs/constraints.md#open-questions)). A member whose role or
    assignment does not permit the request receives `403`. Whether the roles
    and permissions are correct ([OQ-002](docs/constraints.md#open-questions))
    and how they are enforced consistently
    ([OQ-019](docs/constraints.md#open-questions)) are open; the interim
    answer is that this API is the only entry point and checks every request
    ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md)).

    **Errors.** Errors are problem details (RFC 9457) in
    `application/problem+json`. `type` is omitted (meaning `about:blank`), so
    `title` is the HTTP status phrase and `detail` explains the occurrence.
    `415` means that the request content is not in the operation's media
    type ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md);
    decided by the project team on 2026-10-30). `400` means that the
    request content is absent or is not well-formed JSON, or that a query
    parameter value is invalid. `422` means well-formed content that does
    not satisfy the request schema, including unknown properties; `errors`
    points to each invalid member. If a request fails several checks, the
    first applicable status in this order is returned: `401`, `405`, `404`,
    `403`, `415`, `400`, `422`, `409` (`405` placed on 2026-11-02 by team
    decision, Lab Worksheet 03, question 12; previously absent from this
    order). The exceptions are stated where they apply:
    `signIn` is public, so its order is `415`, `400`, `422`, `401`; and in `assignTask` the
    `403` check needs the content. A refused request changes nothing. Texts
    are in English, the proposed user-facing language
    ([Assumption A-028](docs/constraints.md#assumptions);
    [OQ-013](docs/constraints.md#open-questions)); enumeration values are
    language-neutral codes, not labels.

    **Unsupported methods.** A request to a path of this contract with a
    method that the path does not define receives `405` with problem
    details and an `Allow` header that lists the methods the path defines
    ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md), decision 9;
    decided by the project team on 2026-10-30). This rule applies to every
    path and is stated only here, because OpenAPI cannot attach a response
    to a method that a path does not define. It comes just after `401` in
    the order of checks above, so a request without a valid token receives
    `401` whatever its method; for example, `GET /session` receives `401`
    without a valid token, and `405` with `Allow: DELETE, POST` with one.
    *Changed on 2026-11-02 by team decision (Lab Worksheet 03, question 12):
    previously “Its place in the order of checks above is not decided.”*

    **Lists.** Lists are returned whole, except `listProjects`, which is
    paged ([Assumption A-032](docs/constraints.md#assumptions); decided by
    the project team on 2026-11-02, closing the pagination point of
    [ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md); *previously:
    “Lists are returned whole; this draft defines no pagination, because no
    volumes are known ([OQ-010](docs/constraints.md#open-questions))”*).
    Query parameters that an operation does not define are ignored. Unless a
    requirement is cited for it, the order of a list is a proposal of this
    draft. Text matching follows
    [Assumption A-024](docs/constraints.md#assumptions): the name contains
    the search text, ignoring letter case, so partial words match; accents
    are significant until the client decides otherwise
    ([OQ-026](docs/constraints.md#open-questions)).

    **Simultaneous changes.** The last change saved prevails. A change that
    depends on a rule spanning projects, members, and tasks (for example,
    completing a project only without unfinished tasks, or removing a
    participant only without assigned tasks) is checked and applied as one
    indivisible change, so the rule is never broken
    ([Assumption A-029](docs/constraints.md#assumptions);
    [ADR-006](docs/adr/ADR-006-simultaneous-changes.md)). No concurrency
    tokens (`ETag`, `If-Match`, or versions) are defined. How the client
    wants simultaneous changes resolved is still open
    ([OQ-017](docs/constraints.md#open-questions)).

    **Changes from 0.1.0-draft (breaking for the draft).**
    - `Task.assignee` (one assignee or `null`) is replaced by
      `Task.assignees` (zero or more), and the `Assignee` schema by
      `PersonSummary`
      ([FR-010](docs/requirements.md#functional-requirements);
      [Assumption A-019](docs/constraints.md#assumptions)).
    - `Task.priority` is added
      ([FR-018](docs/requirements.md#functional-requirements);
      [Assumption A-021](docs/constraints.md#assumptions)).
    - Paths are relative to the base path `/api`, and every operation except
      `signIn` requires a bearer token
      ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md),
      [ADR-005](docs/adr/ADR-005-authentication-with-jwt.md)).
    - 21 operations are added; see the scope table.
    - Content that is not in the operation's media type receives `415`, not
      `400`
      ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md)).

    **Changes on 2026-11-02 (increment I2; the version stays 0.2.0-draft).**
    Decided by the project team (Lab Worksheet 03); no request or response
    schema changes.
    - The token life cycle is documented, with the team's provisional
      answers to [OQ-027](docs/constraints.md#open-questions) (questions
      2–6, 9, 14, and 17); the `signIn` example's `expiresIn` changes from 3600
      to 28800.
    - `405` is placed just after `401` in the order of checks (question 12).
    - Login names are compared ignoring letter case (question 10), and the
      password rules apply to the prepared accounts (question 8).
    - The acting person is taken only from the token (question 15).

    **Changes on 2026-11-02 (increments I3, I10, and I11, project part; the
    version stays 0.2.0-draft).** Decided by the project team (the
    conversation “Implement project management”).
    - `renameProject` becomes `updateProject`: `name` and `description` can
      be edited (request `UpdateProjectRequest`, previously
      `RenameProjectRequest`).
    - `Project`, `ProjectSummary`, `CreateProjectRequest`, and
      `UpdateProjectRequest` get an optional `description` of at most 1000
      characters; `ProjectName` gets a maximum of 100 characters; names and
      descriptions are trimmed
      ([Assumption A-031](docs/constraints.md#assumptions)).
    - `listProjects` is paged (`page`, `size`) and returns `ProjectPage`,
      previously an array ([Assumption A-032](docs/constraints.md#assumptions)).
    - `progress` and `taskCounts` are optional until I5 returns them.
    - Content of the wrong type receives `422`, not `400`.
    **Other open questions reflected, not answered:**
    - who may create projects and how people receive access
      ([OQ-001](docs/constraints.md#open-questions); interim:
      [Assumption A-016](docs/constraints.md#assumptions),
      [Assumption A-018](docs/constraints.md#assumptions));
    - naming rules beyond "nonempty"
      ([OQ-003](docs/constraints.md#open-questions));
    - task states and transitions
      ([OQ-004](docs/constraints.md#open-questions));
    - what progress measures, and its rounding
      ([OQ-005](docs/constraints.md#open-questions); interim:
      [Assumption A-025](docs/constraints.md#assumptions),
      [Assumption A-026](docs/constraints.md#assumptions));
    - reopening a Completed project and access after completion
      ([OQ-006](docs/constraints.md#open-questions),
      [OQ-008](docs/constraints.md#open-questions));
    - unassignment and reassignment, several assignees, and self-assignment
      ([OQ-007](docs/constraints.md#open-questions),
      [OQ-025](docs/constraints.md#open-questions));
    - Task priority ([OQ-022](docs/constraints.md#open-questions)),
      deletion ([OQ-023](docs/constraints.md#open-questions)), comments
      ([OQ-024](docs/constraints.md#open-questions)), and search and filter
      matching ([OQ-026](docs/constraints.md#open-questions));
    - personal data: display names, member lists, and comments identify
      people, and which data may be processed and which obligations apply
      is open ([OQ-011](docs/constraints.md#open-questions);
      [NFR-003](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria)).
      Login names are never returned. All examples use fictitious people.
servers:
  - url: /api
    description: |
      Base path of the API, on the same origin as the web client
      ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md)). The host
      is not decided ([OQ-020](docs/constraints.md#open-questions)).
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: Signing in and out, and the signed-in person (NFR-001).
  - name: Projects
    description: Projects and their progress (F01, F03).
  - name: Members
    description: Members of a project and their roles (F01).
  - name: Tasks
    description: Tasks of a project, their Task priority, state, and assignees (F02).
  - name: Comments
    description: Comments on tasks (F02).
paths:
  /session:
    post:
      tags: [Identity]
      operationId: signIn
      summary: Sign in with a login name and password
      security: []
      description: |
        Checks the login name and password of a prepared account and, if they
        match, returns a signed access token for the other operations,
        together with the signed-in person.

        **Traceability:**
        [FR-013](docs/requirements.md#functional-requirements);
        [US-013](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-013--sign-in);
        [EX-014](docs/user-stories.md#edge-cases-and-exceptions);
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
        [ADR-005](docs/adr/ADR-005-authentication-with-jwt.md).

        **Rules (proposed, not client-approved):**
        - Only prepared accounts exist; there is no public registration or
          password recovery
          ([Assumption A-016](docs/constraints.md#assumptions),
          [Assumption A-017](docs/constraints.md#assumptions);
          [OQ-001](docs/constraints.md#open-questions)).
        - This is the only public operation, so its order of checks is
          `415`, `400`, `422`, `401`.
        - A wrong password and an unknown login name receive the same `401`
          with the same text, which never says which one was wrong or
          whether the login name exists; the person is not signed in
          ([EX-014](docs/user-stories.md#edge-cases-and-exceptions)).
        - Each successful sign-in issues a new, independent token; an
          `Authorization` header sent with this request is ignored
          (proposal of this draft).
        - The login name is compared ignoring letter case: “Ana” and “ana”
          sign in the same person
          ([ADR-007](docs/adr/ADR-007-build-persistence-and-demonstration-data.md#open-points);
          team decision of 2026-11-02, Lab Worksheet 03, question 10).
        - Any nonempty password is checked against the account; a wrong one,
          including one longer than 72 bytes in UTF-8, receives the `401`
          below (team decision of 2026-11-02, question 8).
        - Clients treat the token as opaque and use `expiresIn` to know
          when to sign in again. The token lasts 8 hours; there is no refresh
          token and no renewal operation, and no limit applies to failed
          attempts (team decisions of 2026-11-02, Lab Worksheet 03, questions
          2, 5, and 9; previously “there is no renewal operation (proposal of
          this draft). The token lifetime, password rules, and the response
          to repeated failed attempts are open (OQ-027); this draft limits no
          attempts.”). See the token life cycle in the description of this
          contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            examples:
              ana:
                summary: US-013 — Ana signs in (placeholder password)
                value:
                  loginName: ana
                  password: example-password
      responses:
        '200':
          description: |
            The person is signed in; the token and the signed-in person are
            returned ([US-013](docs/user-stories.md#us-013--sign-in)).
          headers:
            Cache-Control:
              description: |
                The response contains a token, so it must not be stored by
                caches (proposal of this draft).
              required: true
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
              examples:
                ana:
                  summary: US-013 — Ana is signed in (illustrative token)
                  value:
                    accessToken: example-access-token
                    tokenType: Bearer
                    expiresIn: 28800
                    person:
                      personId: 'c95e0a27'
                      displayName: Ana Silva
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          description: |
            The login name or password is incorrect; the person is not signed
            in, and the response does not say which one was wrong
            ([EX-014](docs/user-stories.md#edge-cases-and-exceptions)). The
            challenge is sent because HTTP requires one with this status.
          headers:
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                incorrectCredentials:
                  summary: EX-014 — wrong password, or unknown login name
                  value:
                    title: Unauthorized
                    status: 401
                    detail: The login name or password is incorrect.
        '422':
          description: |
            The content does not satisfy `SignInRequest`: it is not a JSON
            object, `loginName` or `password` is missing, empty, or not a
            string, or another property is present. Nothing is checked
            against the accounts, and `errors` identifies each invalid
            member.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                emptyPassword:
                  summary: 'Response to {"loginName": "ana", "password": ""}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: A login name and a password are required.
                    errors:
                      - pointer: /password
                        detail: A password is required.
    delete:
      tags: [Identity]
      operationId: signOut
      summary: Sign out
      description: |
        Ends the sign-in of the presented access token: afterwards that token
        is no longer accepted, and any request that presents it receives
        `401`.

        **Traceability:**
        [FR-014](docs/requirements.md#functional-requirements);
        [US-014](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-014--sign-out);
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions);
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
        [ADR-005](docs/adr/ADR-005-authentication-with-jwt.md).

        **Rules (proposed, not client-approved):**
        - Only the presented token is ended; other sign-ins of the same
          person are not affected (proposal of this draft).
        - The token is refused from then on, until it would have expired,
          also after the server restarts: the server keeps the identifier
          and expiry of each ended token, never the token itself, until then
          ([ADR-005](docs/adr/ADR-005-authentication-with-jwt.md#open-points);
          team decision of 2026-11-02, Lab Worksheet 03, question 3;
          previously “ADR-005 proposes that the server keeps the identifiers
          of ended tokens until then, and records this as an open point.”).
        - Signing out again with the same token receives `401`, because the
          token is no longer accepted.
        - The User interface discards the token even if this request fails
          ([ADR-009](docs/adr/ADR-009-identity-from-the-token.md), decision 1;
          team decision of 2026-11-02, question 17).
        - This session policy is the team's provisional answer to
          [OQ-027](docs/constraints.md#open-questions); the client's answer
          prevails. *Changed on 2026-11-02: previously “The effect of
          signing out is part of the open session policy (OQ-027).”*
      responses:
        '204':
          description: |
            The sign-in has ended; the presented token is no longer accepted
            ([US-014](docs/user-stories.md#us-014--sign-out)).
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentPerson
      summary: Show the signed-in person
      description: |
        Returns the identifier and display name of the signed-in person, so
        that the client can show who is signed in.

        **Traceability:**
        [FR-015](docs/requirements.md#functional-requirements);
        [US-015](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-015--see-who-is-signed-in);
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions);
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Only the identifier and display name are returned; the login name
          is never returned (proposal of this draft;
          [Assumption A-017](docs/constraints.md#assumptions);
          [OQ-011](docs/constraints.md#open-questions)).
      responses:
        '200':
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSummary'
              examples:
                ana:
                  summary: US-015 — Ana Silva is signed in
                  value:
                    personId: 'c95e0a27'
                    displayName: Ana Silva
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List or search the signed-in person's projects (My projects)
      description: |
        Returns a page of the signed-in person's accessible projects, Active
        and Completed, each with its name, state, and the person's role. With
        `name`, only the projects whose name contains that text, ignoring
        letter case, are returned. The task counts of each project are added
        by increment I5: until then, `taskCounts` is omitted.

        **Traceability:**
        [FR-001](docs/requirements.md#functional-requirements),
        [FR-022](docs/requirements.md#functional-requirements),
        [FR-024](docs/requirements.md#functional-requirements);
        [US-007](docs/user-stories.md#stories),
        [US-023](docs/user-stories.md#stories), and
        [US-025](docs/user-stories.md#stories) and their acceptance criteria
        ([US-007](docs/user-stories.md#us-007--view-accessible-projects),
        [US-023](docs/user-stories.md#us-023--search-projects),
        [US-025](docs/user-stories.md#us-025--view-my-projects));
        [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-025](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Only accessible projects are returned: projects of which the
          person is not a member, and deleted projects, are never listed,
          also when their name matches `name`
          ([EX-003](docs/user-stories.md#edge-cases-and-exceptions),
          [EX-025](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-002](docs/constraints.md#assumptions),
          [Assumption A-022](docs/constraints.md#assumptions)).
        - Completed projects stay listed, with state `COMPLETED`
          ([Assumption A-011](docs/constraints.md#assumptions)).
        - `name` selects the projects whose name contains the text, ignoring
          letter case ([Assumption A-024](docs/constraints.md#assumptions)),
          so partial words match; accents are significant, so `cafe` does
          not match `Café` ([OQ-026](docs/constraints.md#open-questions)).
          The text is trimmed before it is matched, and only the name is
          searched. An empty `name`, or one of only whitespace, receives
          `400` (proposal of this draft).
        - Paging ([Assumption A-032](docs/constraints.md#assumptions)):
          `page` starts at 1 and defaults to 1; `size` is from 1 to 100 and
          defaults to 20. A `page` or `size` that is not an integer, or is out
          of range, receives `400`. A page past the last one is a successful,
          empty page. The search and the paging combine: `totalItems` counts
          only the matching projects.
        - Order: by name ignoring letter case, then by `projectId`, so the
          pages are stable ([Assumption A-032](docs/constraints.md#assumptions)).
        - An empty page is a successful response: the client then says that
          the person has no projects yet, or that no projects match.
        - Each project's task counts by state, not counting deleted tasks,
          come with I5; no totals across projects are returned
          ([Assumption A-022](docs/constraints.md#assumptions),
          [Assumption A-025](docs/constraints.md#assumptions);
          [OQ-005](docs/constraints.md#open-questions)).
      parameters:
        - name: name
          in: query
          required: false
          description: |
            Search text; only projects whose name contains it, ignoring
            letter case, are returned
            ([Assumption A-024](docs/constraints.md#assumptions)).
          schema:
            type: string
            minLength: 1
          example: web
        - name: page
          in: query
          required: false
          description: |
            Number of the page, starting at 1
            ([Assumption A-032](docs/constraints.md#assumptions)).
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: size
          in: query
          required: false
          description: |
            Number of projects in a page, at most 100
            ([Assumption A-032](docs/constraints.md#assumptions)).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: A page of the person's accessible projects, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
              examples:
                myProjects:
                  summary: US-007 — Active project A and Completed project B; C is not listed
                  value:
                    items:
                      - projectId: '7f3a9c1e'
                        name: Project Alpha
                        state: ACTIVE
                        myRole: PROJECT_PARTICIPANT
                      - projectId: 'b4e2d6a1'
                        name: Project Gamma
                        state: COMPLETED
                        myRole: PROJECT_OWNER
                    page: 1
                    size: 20
                    totalItems: 2
                    totalPages: 1
                searchWeb:
                  summary: US-023 — response to ?name=web
                  value:
                    items:
                      - projectId: 'd3f6a8b1'
                        name: Website Redesign
                        state: ACTIVE
                        myRole: PROJECT_PARTICIPANT
                    page: 1
                    size: 20
                    totalItems: 1
                    totalPages: 1
                noMatch:
                  summary: EX-025 — response to ?name=audit; a non-member project matches but is not listed
                  value:
                    items: []
                    page: 1
                    size: 20
                    totalItems: 0
                    totalPages: 0
                pastTheLastPage:
                  summary: US-007 — response to ?page=3 when there are 25 projects and the size is 20
                  value:
                    items: []
                    page: 3
                    size: 20
                    totalItems: 25
                    totalPages: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: |
        Creates an Active project with a name and an optional description.
        The signed-in person becomes its Project Owner and a member.

        **Traceability:**
        [FR-002](docs/requirements.md#functional-requirements);
        [US-001](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-001--create-project);
        [EX-001](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-012](docs/user-stories.md#edge-cases-and-exceptions)
        and
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Any signed-in person may create projects, so there is no `403`
          ([Assumption A-018](docs/constraints.md#assumptions);
          [OQ-001](docs/constraints.md#open-questions)).
        - The creator becomes the project's Project Owner and a member
          ([Assumption A-008](docs/constraints.md#assumptions)), and the
          project starts Active
          ([Assumption A-003](docs/constraints.md#assumptions)); neither can
          be chosen.
        - The name is required. It is trimmed, and then has 1 to 100
          characters; a name that is empty after trimming, or longer than
          100 characters, creates no project and returns `422` with an error
          for `/name`
          ([EX-001](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-003](docs/constraints.md#assumptions),
          [Assumption A-031](docs/constraints.md#assumptions)). Names are not
          unique ([OQ-003](docs/constraints.md#open-questions)).
        - The description is optional. It is trimmed; a description that is
          absent, `null`, or empty after trimming means “no description”;
          one longer than 1000 characters returns `422` with an error for
          `/description` ([Assumption A-031](docs/constraints.md#assumptions);
          [OQ-028](docs/constraints.md#open-questions)). Lengths count
          Unicode characters.
        - Content of the wrong type, such as a number as the name, is
          well-formed JSON that does not satisfy the schema, so it receives
          `422`, not `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            examples:
              projectAlpha:
                summary: US-001 — create "Project Alpha" with a description
                value:
                  name: Project Alpha
                  description: First release
              withoutDescription:
                summary: US-001 — create a project without a description
                value:
                  name: Project Beta
      responses:
        '201':
          description: |
            The project was created, Active, with the signed-in person as its
            Project Owner ([US-001](docs/user-stories.md#us-001--create-project)).
          headers:
            Location:
              description: URI reference of the created project (`getProject`).
              required: true
              schema:
                type: string
                format: uri-reference
              example: /api/projects/7f3a9c1e
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                projectAlpha:
                  summary: US-001 AC1 — "Project Alpha", Active, created by its Project Owner
                  value:
                    projectId: '7f3a9c1e'
                    name: Project Alpha
                    description: First release
                    state: ACTIVE
                    myRole: PROJECT_OWNER
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            The content does not satisfy `CreateProjectRequest`: it is not a
            JSON object, `name` is missing, empty after trimming, too long, or
            not a string, `description` is too long or neither a string nor
            `null`, or another property is present. No project is created,
            and `errors` identifies each invalid member
            ([EX-001](docs/user-stories.md#edge-cases-and-exceptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                emptyName:
                  summary: 'EX-001 — response to {"name": "  "}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The project is invalid.
                    errors:
                      - pointer: /name
                        detail: A name is required.
                longName:
                  summary: Response to a name of 101 characters
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The project is invalid.
                    errors:
                      - pointer: /name
                        detail: The name must have at most 100 characters.
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: View a project
      description: |
        Returns an accessible project with its name, description, state, and
        the person's role. Its progress, the task counts by state and the
        percentage Done, is added by increment I5: until then, `progress` is
        omitted.

        **Traceability:**
        [FR-001](docs/requirements.md#functional-requirements),
        [FR-012](docs/requirements.md#functional-requirements);
        [US-006](docs/user-stories.md#stories) and
        [US-007](docs/user-stories.md#stories) and their acceptance criteria
        ([US-006](docs/user-stories.md#us-006--view-progress),
        [US-007](docs/user-stories.md#us-007--view-accessible-projects));
        [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-005](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-027](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - A project that does not exist, is deleted, or of which the person
          is not a member receives `404`
          ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md);
          [Assumption A-022](docs/constraints.md#assumptions)).
        - Once `progress` is returned, it counts only tasks that are not deleted
          ([Assumption A-006](docs/constraints.md#assumptions),
          [Assumption A-022](docs/constraints.md#assumptions)); task filters
          never change it
          ([EX-026](docs/user-stories.md#edge-cases-and-exceptions)).
        - `percentDone` is Done tasks / all tasks × 100, rounded to the
          nearest whole number, halves up: 1 of 3 is 33, 2 of 3 is 67, and
          1 of 8 is 13
          ([EX-027](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-026](docs/constraints.md#assumptions);
          [OQ-005](docs/constraints.md#open-questions)).
        - With zero tasks, the counts are 0 and `percentDone` is `null`; the
          client shows "No tasks", never 0% or 100%
          ([EX-005](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-006](docs/constraints.md#assumptions)).
        - Completed projects remain viewable
          ([Assumption A-011](docs/constraints.md#assumptions)).
      responses:
        '200':
          description: The project, with its progress once I5 is delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                withDescription:
                  summary: US-007 — an Active project with a description
                  value:
                    projectId: '7f3a9c1e'
                    name: Project Alpha
                    description: First release
                    state: ACTIVE
                    myRole: PROJECT_PARTICIPANT
                withoutDescription:
                  summary: US-007 — a project without a description omits the property
                  value:
                    projectId: 'a61f0d93'
                    name: Project Delta
                    state: ACTIVE
                    myRole: PROJECT_PARTICIPANT
                completed:
                  summary: US-007 AC2 — a Completed project remains viewable
                  value:
                    projectId: 'b4e2d6a1'
                    name: Project Gamma
                    state: COMPLETED
                    myRole: PROJECT_OWNER
                fourTasks:
                  summary: US-006 AC1, once I5 is delivered — 1 To do, 1 In progress, 2 Done; 50%
                  value:
                    projectId: '7f3a9c1e'
                    name: Project Alpha
                    state: ACTIVE
                    myRole: PROJECT_PARTICIPANT
                    progress:
                      taskCounts:
                        toDo: 1
                        inProgress: 1
                        done: 2
                      percentDone: 50
                noTasks:
                  summary: US-006 AC2 and EX-005, once I5 is delivered — zero tasks; the client shows "No tasks"
                  value:
                    projectId: 'a61f0d93'
                    name: Project Delta
                    state: ACTIVE
                    myRole: PROJECT_PARTICIPANT
                    progress:
                      taskCounts:
                        toDo: 0
                        inProgress: 0
                        done: 0
                      percentDone: null
                oneOfThreeDone:
                  summary: EX-027, once I5 is delivered — 1 of 3 tasks Done; 33%
                  value:
                    projectId: 'c2d8e4f6'
                    name: Project Sigma
                    state: ACTIVE
                    myRole: PROJECT_PARTICIPANT
                    progress:
                      taskCounts:
                        toDo: 1
                        inProgress: 1
                        done: 1
                      percentDone: 33
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Edit a project's name and description
      description: |
        Changes the name and the description of an Active project. The
        content is a JSON Merge Patch
        ([RFC 7396](https://www.rfc-editor.org/rfc/rfc7396)) in which only
        `name` and `description` may appear; a property that is absent is
        left unchanged, so `{}` changes nothing.

        **Traceability:**
        [FR-003](docs/requirements.md#functional-requirements);
        [US-008](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-008--rename-project);
        [EX-009](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-010](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Changed on 2026-11-02 by team decision (the conversation
          “Implement project management”, decision 14): previously
          `renameProject`, which changed only the name.
        - Only the project's Project Owner may edit it
          ([Assumption A-001](docs/constraints.md#assumptions)).
        - `name`, when present, must be a string that has 1 to 100 characters
          after trimming; `null`, which would remove the name under JSON
          Merge Patch, an empty name, a name that is too long, and a value
          that is not a string are refused with `422`, and the project is
          unchanged ([EX-010](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-003](docs/constraints.md#assumptions),
          [Assumption A-031](docs/constraints.md#assumptions)).
        - `description`, when present, is a string of at most 1000
          characters, trimmed, or `null`; `null`, or a description that is
          empty after trimming, removes the description
          ([Assumption A-031](docs/constraints.md#assumptions)).
        - A Completed project cannot be edited
          ([EX-009](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-011](docs/constraints.md#assumptions)).
        - Editing to the current values succeeds and changes nothing
          (proposal of this draft).
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
            examples:
              projectBeta:
                summary: US-008 — rename "Project Alpha" to "Project Beta"
                value:
                  name: Project Beta
              newDescription:
                summary: US-008 — change only the description
                value:
                  description: Second release
              removeDescription:
                summary: US-008 — remove the description
                value:
                  description: null
      responses:
        '200':
          description: |
            The project was edited; the updated project is returned
            ([US-008](docs/user-stories.md#us-008--rename-project)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                projectBeta:
                  summary: US-008 — the project now displays "Project Beta"
                  value:
                    projectId: '7f3a9c1e'
                    name: Project Beta
                    description: First release
                    state: ACTIVE
                    myRole: PROJECT_OWNER
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotProjectOwner'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/ProjectCompleted'
          description: |
            The project is Completed, so it cannot be edited; it is
            unchanged
            ([EX-009](docs/user-stories.md#edge-cases-and-exceptions)).
        '422':
          description: |
            The content does not satisfy `UpdateProjectRequest`: it is not a
            JSON object, `name` is `null`, empty after trimming, too long, or
            not a string, `description` is too long or neither a string nor
            `null`, or another property is present. The project is unchanged,
            and `errors` identifies each invalid member
            ([EX-010](docs/user-stories.md#edge-cases-and-exceptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                emptyName:
                  summary: 'EX-010 — response to {"name": ""}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The project is invalid.
                    errors:
                      - pointer: /name
                        detail: A name is required.
                nullName:
                  summary: 'Response to {"name": null}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The project is invalid.
                    errors:
                      - pointer: /name
                        detail: The name cannot be removed.
                longDescription:
                  summary: Response to a description of 1001 characters
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The project is invalid.
                    errors:
                      - pointer: /description
                        detail: The description must have at most 1000 characters.
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        Deletes an Active project: from then on it is hidden from everyone,
        as if it did not exist, but its data is kept in storage.

        **Traceability:**
        [FR-016](docs/requirements.md#functional-requirements);
        [US-016](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-016--delete-project);
        [EX-015](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-016](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
        soft deletion in [database.md](docs/database.md#rules-not-shown-in-the-diagram).

        **Rules (proposed, not client-approved):**
        - Only the project's Project Owner may delete it
          ([EX-016](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-001](docs/constraints.md#assumptions)).
        - A Completed project cannot be deleted
          ([EX-015](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-011](docs/constraints.md#assumptions),
          [Assumption A-022](docs/constraints.md#assumptions)).
        - A deleted project, with its members, tasks, assignments, and
          comments, receives `404` for everyone and is no longer listed by
          any operation; deleting it again also receives `404`
          ([Assumption A-022](docs/constraints.md#assumptions)).
        - The data is kept, and there is no restore operation; what is kept,
          for how long, restoring, and purging are open
          ([OQ-023](docs/constraints.md#open-questions)).
        - Asking the person to confirm is a step of the client, not of this
          API: this request is sent only after confirmation, and cancelling
          sends nothing, so the project is unchanged
          ([US-016](docs/user-stories.md#us-016--delete-project),
          acceptance criterion 2).
      responses:
        '204':
          description: |
            The project is deleted and hidden from everyone
            ([US-016](docs/user-stories.md#us-016--delete-project)).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotProjectOwner'
          description: |
            The person is a Project Participant, not the Project Owner of
            this project; nothing is deleted
            ([EX-016](docs/user-stories.md#edge-cases-and-exceptions)).
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/ProjectCompleted'
          description: |
            The project is Completed, so it cannot be deleted; it remains
            visible and unchanged
            ([EX-015](docs/user-stories.md#edge-cases-and-exceptions)).
  /projects/{projectId}/state:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      tags: [Projects]
      operationId: completeProject
      summary: Complete a project
      description: |
        Changes the state of an Active project to Completed. Completing is
        the only change of project state in this draft.

        **Traceability:**
        [FR-007](docs/requirements.md#functional-requirements);
        [US-010](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-010--complete-project);
        [EX-006](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-018](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Only the project's Project Owner may complete it
          ([Assumption A-001](docs/constraints.md#assumptions)).
        - The project can be completed only if none of its tasks is To do or
          In progress; a project with zero tasks can be completed. This
          interpretation needs explicit client approval
          ([EX-006](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-007](docs/constraints.md#assumptions);
          [OQ-006](docs/constraints.md#open-questions)).
        - Deleted tasks are not counted as unfinished, so deleting the last
          unfinished task makes the project completable
          ([EX-018](docs/user-stories.md#edge-cases-and-exceptions);
          [OQ-023](docs/constraints.md#open-questions)).
        - The check for unfinished tasks and the change of state happen in
          one indivisible step, so a task changed at the same time cannot be
          left unfinished in a Completed project
          ([Assumption A-029](docs/constraints.md#assumptions);
          [ADR-006](docs/adr/ADR-006-simultaneous-changes.md)).
        - `state` can only be `COMPLETED`; reopening a Completed project is
          not defined ([OQ-006](docs/constraints.md#open-questions)), so any
          other value receives `422`.
        - Completing a project that is already Completed receives `409`
          rather than succeeding unchanged (proposal of this draft).
        - Once Completed, the project and its tasks are read-only, except
          that comments can still be added
          ([Assumption A-011](docs/constraints.md#assumptions),
          [Assumption A-023](docs/constraints.md#assumptions)).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProjectRequest'
            examples:
              complete:
                summary: US-010 — complete the project
                value:
                  state: COMPLETED
      responses:
        '200':
          description: |
            The project is Completed; the updated project is returned
            ([US-010](docs/user-stories.md#us-010--complete-project)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                allDone:
                  summary: US-010 AC1 — all tasks were Done
                  value:
                    projectId: '7f3a9c1e'
                    name: Project Alpha
                    state: COMPLETED
                    myRole: PROJECT_OWNER
                    progress:
                      taskCounts:
                        toDo: 0
                        inProgress: 0
                        done: 4
                      percentDone: 100
                noTasks:
                  summary: US-010 AC2 — zero tasks (needs explicit client approval, A-007)
                  value:
                    projectId: 'a61f0d93'
                    name: Project Delta
                    state: COMPLETED
                    myRole: PROJECT_OWNER
                    progress:
                      taskCounts:
                        toDo: 0
                        inProgress: 0
                        done: 0
                      percentDone: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotProjectOwner'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: |
            The project cannot be completed: at least one of its tasks is To
            do or In progress, so it remains Active
            ([EX-006](docs/user-stories.md#edge-cases-and-exceptions)), or it
            is already Completed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unfinishedTasks:
                  summary: EX-006 — a task is To do or In progress
                  value:
                    title: Conflict
                    status: 409
                    detail: The project has tasks that are To do or In progress; it remains Active.
                alreadyCompleted:
                  summary: The project is already Completed
                  value:
                    title: Conflict
                    status: 409
                    detail: The project is Completed; it cannot be changed.
        '422':
          description: |
            The content does not satisfy `CompleteProjectRequest`: it is not
            a JSON object, `state` is missing or is not `COMPLETED`, or
            another property is present. Reopening is not defined
            ([OQ-006](docs/constraints.md#open-questions)). The state is
            unchanged, and `errors` identifies each invalid member.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                reopen:
                  summary: 'Response to {"state": "ACTIVE"}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: A project can only be changed to the state COMPLETED.
                    errors:
                      - pointer: /state
                        detail: The only accepted value is COMPLETED.
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      operationId: listProjectMembers
      summary: List the members of a project and their roles
      description: |
        Returns every member of an accessible project, with their display
        name and role. The client also uses it to show who can be assigned
        to tasks, since any member is an eligible assignee.

        **Traceability:**
        [FR-025](docs/requirements.md#functional-requirements);
        [US-026](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-026--view-members);
        also supports [US-001](docs/user-stories.md#stories), acceptance
        criterion [2](docs/user-stories.md#us-001--create-project),
        [US-002](docs/user-stories.md#us-002--add-participant),
        [US-009](docs/user-stories.md#us-009--remove-participant), and the
        choice of assignees in
        [US-012](docs/user-stories.md#us-012--assign-task); access rules
        from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Every member, not only the Project Owner, may see the member list
          ([Assumption A-027](docs/constraints.md#assumptions)), also in a
          Completed project.
        - Each member appears once, with role `PROJECT_OWNER` or
          `PROJECT_PARTICIPANT`; the Project Owner is also a member
          ([Assumption A-001](docs/constraints.md#assumptions),
          [Assumption A-008](docs/constraints.md#assumptions)). Removed
          members are not listed.
        - Only display names are returned, never login names
          ([Assumption A-017](docs/constraints.md#assumptions);
          [OQ-011](docs/constraints.md#open-questions)).
        - Order: the Project Owner first, then the other members by display
          name (proposal of this draft).
      responses:
        '200':
          description: The members of the project and their roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
              examples:
                anaRuiEva:
                  summary: US-026 — Ana is the Project Owner; Rui and Eva are Project Participants
                  value:
                    - person:
                        personId: 'c95e0a27'
                        displayName: Ana Silva
                      role: PROJECT_OWNER
                    - person:
                        personId: '0d4a7e3b'
                        displayName: Eva Santos
                      role: PROJECT_PARTICIPANT
                    - person:
                        personId: '3e7b5a90'
                        displayName: Rui Martins
                      role: PROJECT_PARTICIPANT
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    post:
      tags: [Members]
      operationId: addParticipant
      summary: Add a person to a project as a Project Participant
      description: |
        Makes an existing person who is not yet a member a Project
        Participant of an Active project, so that they can view and work on
        it.

        **Traceability:**
        [FR-004](docs/requirements.md#functional-requirements);
        [US-002](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-002--add-participant);
        access rules from
        [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Only the project's Project Owner may add members
          ([Assumption A-001](docs/constraints.md#assumptions)).
        - The person always becomes a Project Participant; the role cannot
          be chosen, and ownership cannot be transferred
          ([OQ-002](docs/constraints.md#open-questions),
          [OQ-008](docs/constraints.md#open-questions)).
        - `personId` must identify an existing person, otherwise `422` with
          an error for `/personId`; `listEligibleParticipants` returns the
          people who can be added.
        - A person who is already a member, including the Project Owner,
          receives `409`, and nothing changes.
        - Members cannot be added to a Completed project
          ([Assumption A-011](docs/constraints.md#assumptions)).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantRequest'
            examples:
              daniel:
                summary: US-002 — the Project Owner adds Daniel Rocha
                value:
                  personId: '6c0f9b25'
      responses:
        '201':
          description: |
            The person is now a Project Participant and can view the project
            ([US-002](docs/user-stories.md#us-002--add-participant)).
          headers:
            Location:
              description: |
                URI reference of the new membership; it is the path of
                `removeParticipant`, and no read operation is defined on it.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /api/projects/7f3a9c1e/members/6c0f9b25
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              examples:
                daniel:
                  summary: US-002 — Daniel Rocha is a Project Participant
                  value:
                    person:
                      personId: '6c0f9b25'
                      displayName: Daniel Rocha
                    role: PROJECT_PARTICIPANT
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotProjectOwner'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: |
            The person is already a member of the project, or the project is
            Completed; nothing changes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyMember:
                  summary: The person is already a member
                  value:
                    title: Conflict
                    status: 409
                    detail: The person is already a member of the project.
                projectCompleted:
                  summary: The project is Completed
                  value:
                    title: Conflict
                    status: 409
                    detail: The project is Completed; it cannot be changed.
        '422':
          description: |
            The content does not satisfy `AddParticipantRequest` (it is not a
            JSON object, `personId` is missing or not a valid `Identifier`,
            or another property is present), or `personId` does not identify
            an existing person. Nothing changes, and `errors` identifies each
            invalid member.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                unknownPerson:
                  summary: '`personId` identifies no person'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The person to add was not found.
                    errors:
                      - pointer: /personId
                        detail: No person has this identifier.
                missingPersonId:
                  summary: 'Response to {}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The person to add is required.
                    errors:
                      - pointer: /personId
                        detail: A person identifier is required.
  /projects/{projectId}/members/{personId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PersonId'
    delete:
      tags: [Members]
      operationId: removeParticipant
      summary: Remove a Project Participant from a project
      description: |
        Removes a Project Participant from an Active project; the person can
        then no longer view the project.

        **Traceability:**
        [FR-005](docs/requirements.md#functional-requirements);
        [US-009](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-009--remove-participant);
        [US-017](docs/user-stories.md#stories), acceptance criterion
        [2](docs/user-stories.md#us-017--delete-task);
        [EX-007](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
        member removal in
        [database.md](docs/database.md#rules-not-shown-in-the-diagram).

        **Rules (proposed, not client-approved):**
        - Only the project's Project Owner may remove members; a Project
          Participant cannot remove anyone, including themselves (proposal of
          this draft: leaving a project is not specified).
        - `404` also when `personId` does not identify a member of the
          project. As every `404`, it is checked before the Project Owner
          check; it discloses nothing new, because every member can see the
          member list ([Assumption A-027](docs/constraints.md#assumptions)).
        - The Project Owner cannot be removed
          ([Assumption A-009](docs/constraints.md#assumptions);
          [OQ-008](docs/constraints.md#open-questions)).
        - A member who is an assignee of a task that is not deleted cannot
          be removed; their assignments must be removed first, or the tasks
          deleted
          ([EX-007](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-009](docs/constraints.md#assumptions),
          [Assumption A-022](docs/constraints.md#assumptions);
          [OQ-007](docs/constraints.md#open-questions)). The check and the
          removal happen in one indivisible step, so an assignment made at
          the same time cannot be left without its member
          ([Assumption A-029](docs/constraints.md#assumptions);
          [ADR-006](docs/adr/ADR-006-simultaneous-changes.md)).
        - Members cannot be removed from a Completed project
          ([Assumption A-011](docs/constraints.md#assumptions)).
        - The removed person's comments are kept and still show them as
          author, because comments cannot be deleted (proposal of this draft,
          following [Assumption A-023](docs/constraints.md#assumptions)).
      responses:
        '204':
          description: |
            The person is no longer a member and can no longer view the
            project ([US-009](docs/user-stories.md#us-009--remove-participant)).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotProjectOwner'
        '404':
          description: |
            The project does not exist, is deleted, or is not accessible to
            the signed-in person, or `personId` does not identify a member of
            the project.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  summary: Unknown, deleted, or inaccessible project, or not a member
                  value:
                    title: Not Found
                    status: 404
                    detail: The project or member does not exist or is not accessible.
        '409':
          description: |
            The person is the Project Owner, is an assignee of at least one
            task that is not deleted
            ([EX-007](docs/user-stories.md#edge-cases-and-exceptions)), or
            the project is Completed. The person remains a member.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                projectOwner:
                  summary: The person is the Project Owner
                  value:
                    title: Conflict
                    status: 409
                    detail: The Project Owner cannot be removed from the project.
                assignedTasks:
                  summary: EX-007 — the person has assigned tasks
                  value:
                    title: Conflict
                    status: 409
                    detail: The person is assigned to tasks of this project; remove those assignments first.
                projectCompleted:
                  summary: The project is Completed
                  value:
                    title: Conflict
                    status: 409
                    detail: The project is Completed; it cannot be changed.
  /projects/{projectId}/eligible-participants:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      operationId: listEligibleParticipants
      summary: List the people who can be added to a project
      description: |
        Returns the people who are not members of the project, so that its
        Project Owner can choose whom to add with `addParticipant`.

        **Traceability:**
        [FR-004](docs/requirements.md#functional-requirements);
        [US-002](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-002--add-participant);
        access rules from
        [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Only the project's Project Owner may use it
          ([Assumption A-001](docs/constraints.md#assumptions)). It also
          answers for a Completed project, although nobody can be added to
          it (proposal of this draft).
        - Every person who is not a member of the project is returned, with
          identifier and display name only; login names are never returned
          ([Assumption A-016](docs/constraints.md#assumptions),
          [Assumption A-017](docs/constraints.md#assumptions)). This
          discloses the display names of people outside the Project Owner's
          projects, and any signed-in person can become a Project Owner
          ([Assumption A-018](docs/constraints.md#assumptions)). This rule is
          a proposal registered as
          [Assumption A-030](docs/constraints.md#assumptions), not yet
          decided by the team; which personal data may be shown, and to whom,
          is open ([OQ-011](docs/constraints.md#open-questions);
          [NFR-003](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria)).
        - `name` selects the people whose display name contains the text,
          ignoring letter case (proposal of this draft, following
          [Assumption A-024](docs/constraints.md#assumptions);
          [OQ-026](docs/constraints.md#open-questions)). An empty `name`
          receives `400`.
        - Order: by display name (proposal of this draft).
      parameters:
        - name: name
          in: query
          required: false
          description: |
            Search text; only people whose display name contains it, ignoring
            letter case, are returned.
          schema:
            type: string
            minLength: 1
          example: rocha
      responses:
        '200':
          description: The people who are not members of the project, possibly none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonSummary'
              examples:
                everyone:
                  summary: US-002 — the people who can be added
                  value:
                    - personId: 'e8a1c3d7'
                      displayName: Carla Mendes
                    - personId: '6c0f9b25'
                      displayName: Daniel Rocha
                searchRocha:
                  summary: Response to ?name=rocha
                  value:
                    - personId: '6c0f9b25'
                      displayName: Daniel Rocha
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotProjectOwner'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List or filter the tasks of a project
      description: |
        Returns a page of the tasks of an accessible project, each with its
        title, state, Task priority, and assignees. With `state` or
        `priority`, only the matching tasks are returned.

        **Traceability:**
        [FR-006](docs/requirements.md#functional-requirements),
        [FR-023](docs/requirements.md#functional-requirements);
        [US-004](docs/user-stories.md#stories) and
        [US-024](docs/user-stories.md#stories) and their acceptance criteria
        ([US-004](docs/user-stories.md#us-004--view-tasks),
        [US-024](docs/user-stories.md#us-024--filter-tasks));
        [EX-026](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Every member may view the tasks, also in a Completed project
          ([Assumption A-002](docs/constraints.md#assumptions),
          [Assumption A-011](docs/constraints.md#assumptions)). Deleted
          tasks are never listed
          ([Assumption A-022](docs/constraints.md#assumptions)).
        - A task matches if its state is any of the given `state` values and
          its Task priority is any of the given `priority` values; an absent
          parameter does not restrict, and repeating a value has no further
          effect ([Assumption A-024](docs/constraints.md#assumptions);
          [OQ-026](docs/constraints.md#open-questions)).
        - Values are the codes of `TaskState` and `TaskPriority`, never
          labels; any other value, including an empty one, receives `400`.
        - Filters change only this list: progress, returned by `getProject`,
          always counts every task that is not deleted
          ([EX-026](docs/user-stories.md#edge-cases-and-exceptions)).
        - An empty list is a successful response: the client then says that
          the project has no tasks, or that no tasks match the filters
          ([EX-026](docs/user-stories.md#edge-cases-and-exceptions)).
        - Filters and paging combine: the page is taken from the matching
          tasks, and `totalItems` counts them
          ([Assumption A-032](docs/constraints.md#assumptions), as amended
          for tasks). A page past the last is empty; a `page` or `size`
          outside its range receives `400`.
        - Order: by creation, oldest first, from a technical order that is
          never exposed
          ([ADR-008](docs/adr/ADR-008-domain-driven-design.md)).
      parameters:
        - name: page
          in: query
          required: false
          description: |
            Number of the page, starting at 1
            ([Assumption A-032](docs/constraints.md#assumptions)).
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: size
          in: query
          required: false
          description: |
            Number of tasks in a page, at most 100
            ([Assumption A-032](docs/constraints.md#assumptions)).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: state
          in: query
          required: false
          description: |
            Task state to include; repeat the parameter to include several
            (`?state=TO_DO&state=IN_PROGRESS`).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/TaskState'
          example: [TO_DO, IN_PROGRESS]
        - name: priority
          in: query
          required: false
          description: |
            Task priority to include; repeat the parameter to include several
            (`?priority=MEDIUM&priority=HIGH`).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/TaskPriority'
          example: [HIGH]
      responses:
        '200':
          description: A page of the tasks of the project that match the filters, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
              examples:
                allTasks:
                  summary: US-004 — "Prepare proposal" unassigned and "Review proposal" assigned to Ana
                  value:
                    items:
                      - taskId: '41b2d8e0'
                        projectId: '7f3a9c1e'
                        title: Prepare proposal
                        state: TO_DO
                        priority: MEDIUM
                        assignees: []
                      - taskId: '9d07c3f5'
                        projectId: '7f3a9c1e'
                        title: Review proposal
                        state: IN_PROGRESS
                        priority: HIGH
                        assignees:
                          - personId: 'c95e0a27'
                            displayName: Ana Silva
                    page: 1
                    size: 20
                    totalItems: 2
                    totalPages: 1
                filtered:
                  summary: US-024 — response to ?state=TO_DO&state=IN_PROGRESS&priority=HIGH
                  value:
                    items:
                      - taskId: 'e1f7b2c9'
                        projectId: '7f3a9c1e'
                        title: T1
                        state: TO_DO
                        priority: HIGH
                        assignees: []
                      - taskId: '4d8a0c63'
                        projectId: '7f3a9c1e'
                        title: T2
                        state: IN_PROGRESS
                        priority: HIGH
                        assignees: []
                    page: 1
                    size: 20
                    totalItems: 2
                    totalPages: 1
                noMatch:
                  summary: EX-026 — no task matches the filters
                  value:
                    items: []
                    page: 1
                    size: 20
                    totalItems: 0
                    totalPages: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task in a project
      description: |
        Creates a task with a title in an Active project. The task
        starts in To do with no assignee and, unless another is chosen, with
        Task priority Medium.

        **Traceability:**
        [FR-008](docs/requirements.md#functional-requirements),
        [FR-018](docs/requirements.md#functional-requirements);
        [US-003](docs/user-stories.md#stories), acceptance criterion
        [1](docs/user-stories.md#us-003--create-task);
        [US-018](docs/user-stories.md#stories), acceptance criteria
        [1 and 2](docs/user-stories.md#us-018--set-task-priority);
        [EX-002](docs/user-stories.md#edge-cases-and-exceptions); access rules
        from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Only the project's Project Owner may create tasks
          ([FR-008](docs/requirements.md#functional-requirements);
          [Assumption A-001](docs/constraints.md#assumptions)); any other
          member receives `403`.
        - The project must be Active; if it is Completed, no task is created
          and `409` is returned
          ([FR-008](docs/requirements.md#functional-requirements);
          [Assumption A-011](docs/constraints.md#assumptions)).
        - The title is required. It is trimmed, and then has 1 to 150
          characters; a title that is empty after trimming, including one made
          only of spaces or no-break spaces, creates no task and returns
          `422` with an error for `/title`
          ([EX-002](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-004](docs/constraints.md#assumptions)). Lengths count
          Unicode code points
          ([OQ-003](docs/constraints.md#open-questions): the limits are the
          team's interim answer, not the client's).
        - `description` is optional: trimmed, up to 2000 characters, and
          empty or `null` means none
          ([Assumption A-033](docs/constraints.md#assumptions);
          [OQ-030](docs/constraints.md#open-questions)).
        - The task belongs to this project only, and its initial state is To
          do and cannot be chosen
          ([Assumption A-004](docs/constraints.md#assumptions),
          [Assumption A-010](docs/constraints.md#assumptions)).
        - `priority` is optional and defaults to `MEDIUM`
          ([FR-018](docs/requirements.md#functional-requirements);
          [Assumption A-021](docs/constraints.md#assumptions);
          [OQ-022](docs/constraints.md#open-questions)).
        - No assignee is accepted (proposal of this draft): FR-008 and US-003
          do not state whether a task can be assigned when it is created.
          Assignees are added afterwards with `assignTask`
          ([FR-010](docs/requirements.md#functional-requirements),
          [FR-019](docs/requirements.md#functional-requirements)).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            examples:
              prepareProposal:
                summary: US-003 and US-018 AC1 — create an unassigned task without choosing a Task priority
                value:
                  title: Prepare proposal
              highPriority:
                summary: US-018 AC2 — create a task with Task priority High
                value:
                  title: Prepare budget
                  priority: HIGH
      responses:
        '201':
          description: |
            The task was created in To do with no assignee
            ([US-003](docs/user-stories.md#us-003--create-task),
            [US-018](docs/user-stories.md#us-018--set-task-priority)).
          headers:
            Location:
              description: URI reference of the created task (`getTask`).
              required: true
              schema:
                type: string
                format: uri-reference
              example: /api/projects/7f3a9c1e/tasks/41b2d8e0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                prepareProposal:
                  summary: US-003 and US-018 AC1 — To do, no assignee, Task priority Medium
                  value:
                    taskId: '41b2d8e0'
                    projectId: '7f3a9c1e'
                    title: Prepare proposal
                    state: TO_DO
                    priority: MEDIUM
                    assignees: []
                highPriority:
                  summary: US-018 AC2 — Task priority High
                  value:
                    taskId: '8c1f5e3a'
                    projectId: '7f3a9c1e'
                    title: Prepare budget
                    state: TO_DO
                    priority: HIGH
                    assignees: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The person is a member of the project but not its Project Owner;
            no task is created
            ([FR-008](docs/requirements.md#functional-requirements);
            [Assumption A-001](docs/constraints.md#assumptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notProjectOwner:
                  summary: FR-008 — a Project Participant tries to create a task
                  value:
                    title: Forbidden
                    status: 403
                    detail: Only the Project Owner can create tasks in this project.
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: |
            The project is not Active (it is Completed); no task is created
            ([FR-008](docs/requirements.md#functional-requirements);
            [Assumption A-011](docs/constraints.md#assumptions)). Whether a
            Completed project can be reopened is open
            ([OQ-006](docs/constraints.md#open-questions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                projectCompleted:
                  summary: FR-008 — the project is Completed
                  value:
                    title: Conflict
                    status: 409
                    detail: The project is Completed; tasks cannot be created in it.
        '422':
          description: |
            The content does not satisfy `CreateTaskRequest`: it is not a JSON
            object, `title` is missing, empty after trimming, too long, or not
            a string, `description` is too long or not a string, `priority` is
            not one of the codes of `TaskPriority`, or another property is
            present. No task is created, and `errors` identifies each invalid
            member ([EX-002](docs/user-stories.md#edge-cases-and-exceptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                emptyTitle:
                  summary: 'EX-002 — response to {"title": ""}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: A task title is required.
                    errors:
                      - pointer: /title
                        detail: A title is required.
                labelInsteadOfCode:
                  summary: 'Response to {"title": "Prepare budget", "priority": "High"}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The Task priority is not valid.
                    errors:
                      - pointer: /priority
                        detail: Use one of LOW, MEDIUM, or HIGH.
  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: View a task
      description: |
        Returns one task of an accessible project with its title, state, Task
        priority, and assignees.

        **Traceability:**
        [FR-006](docs/requirements.md#functional-requirements);
        [US-004](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-004--view-tasks);
        access rules from
        [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Every member may view the task, also in a Completed project
          ([Assumption A-002](docs/constraints.md#assumptions),
          [Assumption A-011](docs/constraints.md#assumptions)).
        - A deleted task, or a task of a deleted project, receives `404`
          ([Assumption A-022](docs/constraints.md#assumptions)).
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                reviewProposal:
                  summary: US-004 — "Review proposal", In progress, assigned to Ana
                  value:
                    taskId: '9d07c3f5'
                    projectId: '7f3a9c1e'
                    title: Review proposal
                    description: Check the numbers and the schedule.
                    state: IN_PROGRESS
                    priority: HIGH
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Change the title, description, or Task priority of a task
      description: |
        Changes the title, the description, the Task priority, or any of them,
        of a task in an Active project. The content is a JSON Merge Patch
        ([RFC 7396](https://www.rfc-editor.org/rfc/rfc7396)); members that
        are absent are left unchanged.

        **Traceability:**
        [FR-009](docs/requirements.md#functional-requirements),
        [FR-018](docs/requirements.md#functional-requirements);
        [US-011](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-011--rename-task);
        [US-018](docs/user-stories.md#stories), acceptance criterion
        [3](docs/user-stories.md#us-018--set-task-priority);
        [EX-011](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-019](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Only the project's Project Owner may change a task's title,
          description, or Task priority; any other member receives `403`, and
          nothing changes
          ([EX-019](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-001](docs/constraints.md#assumptions),
          [Assumption A-021](docs/constraints.md#assumptions)).
        - At least one of `title`, `description`, and `priority` is required.
          `title` must be a string that has 1 to 150 characters after
          trimming, so one made only of spaces or no-break spaces is refused
          ([EX-011](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-004](docs/constraints.md#assumptions);
          [OQ-003](docs/constraints.md#open-questions)). `description` is
          a string of up to 2000 characters after trimming, and `null` or an
          empty one removes it
          ([Assumption A-033](docs/constraints.md#assumptions)). `priority`
          is one of the codes of `TaskPriority`
          ([OQ-022](docs/constraints.md#open-questions)). `title` and
          `priority` cannot be removed, so `null`, which would remove a
          member under JSON Merge Patch, receives `422`. If any member is
          invalid, nothing changes.
        - The task's state and assignees are not changed here, but with
          `changeTaskState`, `assignTask`, and `unassignTask`.
        - Tasks of a Completed project cannot be changed
          ([Assumption A-011](docs/constraints.md#assumptions)).
        - Setting the current values succeeds and changes nothing (proposal
          of this draft).
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            examples:
              changeTitle:
                summary: US-011 — change "Prepare proposal" to "Prepare final proposal"
                value:
                  title: Prepare final proposal
              lowerPriority:
                summary: US-018 AC3 — change the Task priority from Medium to Low
                value:
                  priority: LOW
      responses:
        '200':
          description: |
            The task was changed; the updated task is returned
            ([US-011](docs/user-stories.md#us-011--rename-task),
            [US-018](docs/user-stories.md#us-018--set-task-priority)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                changeTitle:
                  summary: US-011 — the task shows "Prepare final proposal"
                  value:
                    taskId: '41b2d8e0'
                    projectId: '7f3a9c1e'
                    title: Prepare final proposal
                    state: TO_DO
                    priority: MEDIUM
                    assignees: []
                lowerPriority:
                  summary: US-018 AC3 — the task shows Task priority Low
                  value:
                    taskId: '41b2d8e0'
                    projectId: '7f3a9c1e'
                    title: Prepare proposal
                    state: TO_DO
                    priority: LOW
                    assignees: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotProjectOwner'
          description: |
            The person is a member of the project but not its Project Owner;
            the title and Task priority are unchanged
            ([EX-019](docs/user-stories.md#edge-cases-and-exceptions)).
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/ProjectCompleted'
        '422':
          description: |
            The content does not satisfy `UpdateTaskRequest`: it is not a
            JSON object or is an empty one, `title` is `null`, empty after
            trimming, too long, or not a string, `description` is too long or
            not a string, `priority` is `null` or not one of the codes of
            `TaskPriority`, or another property is present. Nothing changes,
            and `errors` identifies each invalid member
            ([EX-011](docs/user-stories.md#edge-cases-and-exceptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                emptyTitle:
                  summary: 'EX-011 — response to {"title": ""}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: A task title is required.
                    errors:
                      - pointer: /title
                        detail: A title is required.
                nullPriority:
                  summary: 'Response to {"priority": null}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The Task priority cannot be removed.
                    errors:
                      - pointer: /priority
                        detail: Use one of LOW, MEDIUM, or HIGH.
                emptyObject:
                  summary: 'Response to {}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: Nothing to change; give a title, a description, a Task priority, or any of them.
                    errors:
                      - pointer: ''
                        detail: At least one of title, description, and priority is required.
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      description: |
        Deletes a task of an Active project: from then on it is hidden from
        everyone, as if it did not exist, but its data is kept in storage.

        **Traceability:**
        [FR-017](docs/requirements.md#functional-requirements);
        [US-017](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-017--delete-task);
        [EX-016](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-017](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-018](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
        soft deletion in [database.md](docs/database.md#rules-not-shown-in-the-diagram).

        **Rules (proposed, not client-approved):**
        - Only the project's Project Owner may delete tasks
          ([EX-016](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-001](docs/constraints.md#assumptions)).
        - Tasks of a Completed project cannot be deleted
          ([EX-017](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-011](docs/constraints.md#assumptions),
          [Assumption A-022](docs/constraints.md#assumptions)).
        - A deleted task receives `404` for everyone, is no longer listed,
          and is no longer counted in progress or in the check for
          unfinished tasks; deleting it again also receives `404`. In
          [US-017](docs/user-stories.md#us-017--delete-task), acceptance
          criterion 1, deleting the To do task of 2 Done, 1 In progress, and
          1 To do leaves 2 Done, 1 In progress, 0 To do, and 67%
          ([Assumption A-022](docs/constraints.md#assumptions),
          [Assumption A-026](docs/constraints.md#assumptions)).
        - Deleting a task removes its assignments, so a member whose only
          assigned task is deleted can then be removed
          ([US-017](docs/user-stories.md#us-017--delete-task), acceptance
          criterion 2; [Assumption A-009](docs/constraints.md#assumptions)).
          Its comments are kept but hidden with it.
        - Deleting the only unfinished task makes the project completable,
          which lets the completion rule be bypassed; this needs explicit
          client approval
          ([EX-018](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-007](docs/constraints.md#assumptions);
          [OQ-023](docs/constraints.md#open-questions)).
        - The data is kept, and there is no restore operation
          ([OQ-023](docs/constraints.md#open-questions)). Asking the person
          to confirm is a step of the client, not of this API.
      responses:
        '204':
          description: |
            The task is deleted and hidden from everyone
            ([US-017](docs/user-stories.md#us-017--delete-task)).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotProjectOwner'
          description: |
            The person is a Project Participant, not the Project Owner of
            this project; nothing is deleted
            ([EX-016](docs/user-stories.md#edge-cases-and-exceptions)).
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/ProjectCompleted'
          description: |
            The project is Completed, so its tasks cannot be deleted; the
            task remains visible and unchanged
            ([EX-017](docs/user-stories.md#edge-cases-and-exceptions)).
  /projects/{projectId}/tasks/{taskId}/state:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      operationId: changeTaskState
      summary: Change the state of a task
      description: |
        Sets the state of a task in an Active project to To do, In progress,
        or Done, and returns the updated task.

        **Traceability:**
        [FR-011](docs/requirements.md#functional-requirements);
        [US-005](docs/user-stories.md#stories), acceptance criteria
        [1, 2, and 3](docs/user-stories.md#us-005--change-task-state);
        [EX-004](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-008](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-013](docs/user-stories.md#edge-cases-and-exceptions); access rules
        from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - The Project Owner and any assignee of the task may change the state
          ([FR-011](docs/requirements.md#functional-requirements);
          [Assumption A-001](docs/constraints.md#assumptions),
          [Assumption A-019](docs/constraints.md#assumptions);
          [OQ-025](docs/constraints.md#open-questions)). The Project Owner
          may, whether or not they are an assignee
          ([EX-013](docs/user-stories.md#edge-cases-and-exceptions)).
          Any other member receives `403` and the state is unchanged
          ([EX-004](docs/user-stories.md#edge-cases-and-exceptions)); a
          Project Participant can first assign themselves with `assignTask`
          ([Assumption A-020](docs/constraints.md#assumptions)).
        - Besides non-members and deleted projects or tasks, `404` also
          covers a `taskId` that does not belong to the project in the path.
        - Any of the three states can be set from any state, including
          reopening a Done task
          ([Assumption A-005](docs/constraints.md#assumptions);
          [OQ-004](docs/constraints.md#open-questions)). Requesting the state
          the task already has succeeds and leaves it unchanged, because `PUT`
          is idempotent.
        - If the project is Completed, the state is unchanged and `409` is
          returned ([EX-008](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-011](docs/constraints.md#assumptions)).
        - If two members change the state at the same time, the last change
          saved prevails ([Assumption A-029](docs/constraints.md#assumptions);
          [ADR-006](docs/adr/ADR-006-simultaneous-changes.md);
          [OQ-017](docs/constraints.md#open-questions)).
        - No reopening marker is recorded: the “(reopened)” of US-005 is read
          as describing the change, as flagged in the
          [data model](docs/database.md#findings)
          ([OQ-004](docs/constraints.md#open-questions)).

        A dedicated `state` sub-resource keeps this change, which any
        assignee may make, separate from changing a task's title or Task
        priority (`updateTask`;
        [FR-009](docs/requirements.md#functional-requirements),
        [FR-018](docs/requirements.md#functional-requirements)), which only
        the Project Owner may do, and from changing its assignees
        (`assignTask` and `unassignTask`;
        [FR-010](docs/requirements.md#functional-requirements),
        [FR-019](docs/requirements.md#functional-requirements)).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTaskStateRequest'
            examples:
              assigneeMarksDone:
                summary: US-005 AC1 — the assignee changes To do to Done
                value:
                  state: DONE
              assigneeReopens:
                summary: US-005 AC2 — the assignee reopens a Done task
                value:
                  state: IN_PROGRESS
              secondAssigneeStarts:
                summary: US-005 AC3 — Rui, one of two assignees, changes To do to In progress
                value:
                  state: IN_PROGRESS
              ownerMarksUnassignedDone:
                summary: EX-013 — the Project Owner changes an unassigned task to Done
                value:
                  state: DONE
      responses:
        '200':
          description: The state was set; the updated task is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                assigneeMarksDone:
                  summary: US-005 AC1 — the task shows Done
                  value:
                    taskId: '9d07c3f5'
                    projectId: '7f3a9c1e'
                    title: Review proposal
                    state: DONE
                    priority: HIGH
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
                assigneeReopens:
                  summary: US-005 AC2 — the task shows In progress (reopened)
                  value:
                    taskId: '9d07c3f5'
                    projectId: '7f3a9c1e'
                    title: Review proposal
                    state: IN_PROGRESS
                    priority: HIGH
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
                secondAssigneeStarts:
                  summary: US-005 AC3 — the task assigned to Ana and Rui shows In progress
                  value:
                    taskId: '8c1f5e3a'
                    projectId: '7f3a9c1e'
                    title: Prepare budget
                    state: IN_PROGRESS
                    priority: HIGH
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
                      - personId: '3e7b5a90'
                        displayName: Rui Martins
                ownerMarksUnassignedDone:
                  summary: EX-013 — the unassigned task shows Done
                  value:
                    taskId: '41b2d8e0'
                    projectId: '7f3a9c1e'
                    title: Prepare proposal
                    state: DONE
                    priority: MEDIUM
                    assignees: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The person is a member of the project but may not change the
            state: only the Project Owner or an assignee of the task may. The state is
            unchanged
            ([EX-004](docs/user-stories.md#edge-cases-and-exceptions);
            [Assumption A-001](docs/constraints.md#assumptions),
            [Assumption A-019](docs/constraints.md#assumptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notOwnerOrAssignee:
                  summary: EX-004 — the task is assigned to someone else
                  value:
                    title: Forbidden
                    status: 403
                    detail: Only the Project Owner or an assignee of the task can change its state.
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          description: |
            The project is not Active (it is Completed); the state is unchanged
            ([EX-008](docs/user-stories.md#edge-cases-and-exceptions);
            [Assumption A-011](docs/constraints.md#assumptions)). Whether a
            Completed project can be reopened is open
            ([OQ-006](docs/constraints.md#open-questions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                projectCompleted:
                  summary: EX-008 — the task's project is Completed
                  value:
                    title: Conflict
                    status: 409
                    detail: The project is Completed; its tasks cannot be changed.
        '422':
          description: |
            The content does not satisfy `ChangeTaskStateRequest`: it is not a
            JSON object, `state` is missing or is not `TO_DO`, `IN_PROGRESS`,
            or `DONE`, or another property is present
            ([Assumption A-005](docs/constraints.md#assumptions)). The state is
            unchanged, and `errors` identifies each invalid member.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                labelInsteadOfCode:
                  summary: 'Response to {"state": "Done"}, a label instead of a code'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The state must be TO_DO, IN_PROGRESS, or DONE.
                    errors:
                      - pointer: /state
                        detail: Must be TO_DO, IN_PROGRESS, or DONE.
  /projects/{projectId}/tasks/{taskId}/assignees:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: assignTask
      summary: Assign a member to a task
      description: |
        Makes a member of the project an assignee of a task in an Active
        project, in addition to its current assignees, and returns the
        updated task.

        **Traceability:**
        [FR-010](docs/requirements.md#functional-requirements),
        [FR-019](docs/requirements.md#functional-requirements);
        [US-012](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-012--assign-task);
        [US-020](docs/user-stories.md#stories), acceptance criterion
        [1](docs/user-stories.md#us-020--assign-or-unassign-myself);
        [EX-020](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-021](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-022](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - The Project Owner may assign any member of the project, including
          themselves, and a task can have several assignees
          ([US-012](docs/user-stories.md#us-012--assign-task);
          [Assumption A-019](docs/constraints.md#assumptions);
          [OQ-025](docs/constraints.md#open-questions)).
        - A Project Participant may assign only themselves; naming another
          person receives `403`, and the assignees are unchanged
          ([EX-021](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-020](docs/constraints.md#assumptions)). Once
          assigned, they can change the task's state
          ([US-020](docs/user-stories.md#us-020--assign-or-unassign-myself)),
          so any Project Participant can change the state of any task; the
          register flags that this weakens the restriction in
          [Assumption A-001](docs/constraints.md#assumptions) and the intent
          of
          [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria)
          and [EX-004](docs/user-stories.md#edge-cases-and-exceptions)
          ([Assumption A-020](docs/constraints.md#assumptions);
          [OQ-002](docs/constraints.md#open-questions),
          [OQ-025](docs/constraints.md#open-questions)).
        - The `403` check needs `personId`, so this operation checks in the
          order `401`, `404`, `415`, `400`, `422` for content that does not satisfy
          `AssignTaskRequest`, `403`, `422` for a person who is not a member,
          `409` ([Assumption A-035](docs/constraints.md#assumptions);
          [ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md)). A
          Project Participant naming
          another person therefore receives `403` whether or not that person
          is a member.
        - `personId` must identify a member of the project, otherwise `422`
          with an error for `/personId`, and the assignees are unchanged
          ([EX-020](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-019](docs/constraints.md#assumptions)). A person who
          does not exist receives the same response
          ([EX-029](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-035](docs/constraints.md#assumptions)).
        - Assigning a person who is already an assignee succeeds and changes
          nothing, so repeating the request is harmless.
        - Assignees of tasks in a Completed project cannot be changed
          ([EX-022](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-011](docs/constraints.md#assumptions)).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
            examples:
              ownerAssignsParticipant:
                summary: US-012 AC1 — the Project Owner assigns Project Participant Ana
                value:
                  personId: 'c95e0a27'
              ownerAddsSecondAssignee:
                summary: US-012 AC2 — the Project Owner also assigns Rui to a task assigned to Ana
                value:
                  personId: '3e7b5a90'
              ownerAssignsThemselves:
                summary: US-012 AC3 — the Project Owner, Bruno, assigns himself
                value:
                  personId: '2b6e4f18'
              participantAssignsThemselves:
                summary: US-020 AC1 — Project Participant Rui assigns himself
                value:
                  personId: '3e7b5a90'
      responses:
        '200':
          description: |
            The person is an assignee of the task; the updated task is
            returned ([US-012](docs/user-stories.md#us-012--assign-task),
            [US-020](docs/user-stories.md#us-020--assign-or-unassign-myself)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                ownerAssignsParticipant:
                  summary: US-012 AC1 — the task shows Ana as an assignee
                  value:
                    taskId: '41b2d8e0'
                    projectId: '7f3a9c1e'
                    title: Prepare proposal
                    state: TO_DO
                    priority: MEDIUM
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
                ownerAddsSecondAssignee:
                  summary: US-012 AC2 — the task shows both Ana and Rui
                  value:
                    taskId: '41b2d8e0'
                    projectId: '7f3a9c1e'
                    title: Prepare proposal
                    state: TO_DO
                    priority: MEDIUM
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
                      - personId: '3e7b5a90'
                        displayName: Rui Martins
                ownerAssignsThemselves:
                  summary: US-012 AC3 — the task shows the Project Owner as an assignee
                  value:
                    taskId: '41b2d8e0'
                    projectId: '7f3a9c1e'
                    title: Prepare proposal
                    state: TO_DO
                    priority: MEDIUM
                    assignees:
                      - personId: '2b6e4f18'
                        displayName: Bruno Costa
                participantAssignsThemselves:
                  summary: US-020 AC1 — the task shows Rui among its assignees
                  value:
                    taskId: '9d07c3f5'
                    projectId: '7f3a9c1e'
                    title: Review proposal
                    state: IN_PROGRESS
                    priority: HIGH
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
                      - personId: '3e7b5a90'
                        displayName: Rui Martins
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The person is a Project Participant and named someone other than
            themselves; the assignees are unchanged
            ([EX-021](docs/user-stories.md#edge-cases-and-exceptions);
            [Assumption A-020](docs/constraints.md#assumptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                assignsSomeoneElse:
                  summary: EX-021 — Project Participant Rui tries to assign another member
                  value:
                    title: Forbidden
                    status: 403
                    detail: A Project Participant can assign only themselves.
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/ProjectCompleted'
          description: |
            The project is Completed, so the task's assignees cannot be
            changed; they are unchanged
            ([EX-022](docs/user-stories.md#edge-cases-and-exceptions)).
        '422':
          description: |
            The content does not satisfy `AssignTaskRequest` (it is not a
            JSON object, `personId` is missing or not a valid `Identifier`,
            or another property is present), or `personId` does not identify
            a member of the project. The assignees are unchanged, and
            `errors` identifies each invalid member
            ([EX-020](docs/user-stories.md#edge-cases-and-exceptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                notAMember:
                  summary: EX-020 — the Project Owner names a person who is not a member
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: Only members of the project can be assigned to its tasks.
                    errors:
                      - pointer: /personId
                        detail: This person is not a member of the project.
                missingPersonId:
                  summary: 'Response to {}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: The person to assign is required.
                    errors:
                      - pointer: /personId
                        detail: A person identifier is required.
  /projects/{projectId}/tasks/{taskId}/assignees/{personId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/PersonId'
    delete:
      tags: [Tasks]
      operationId: unassignTask
      summary: Remove an assignee from a task
      description: |
        Removes one assignee from a task in an Active project and returns the
        updated task, so that the client can show the remaining assignees.

        **Traceability:**
        [FR-010](docs/requirements.md#functional-requirements),
        [FR-019](docs/requirements.md#functional-requirements);
        [US-019](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-019--unassign-a-member);
        [US-020](docs/user-stories.md#stories), acceptance criterion
        [2](docs/user-stories.md#us-020--assign-or-unassign-myself);
        [EX-021](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-022](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - The Project Owner may remove any assignee, including themselves
          ([US-019](docs/user-stories.md#us-019--unassign-a-member);
          [Assumption A-019](docs/constraints.md#assumptions);
          [OQ-007](docs/constraints.md#open-questions)).
        - A Project Participant may remove only themselves; removing another
          assignee receives `403`, and the assignees are unchanged
          ([EX-021](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-020](docs/constraints.md#assumptions);
          [OQ-025](docs/constraints.md#open-questions)).
        - `404` also when `personId` is not an assignee of the task. As
          every `404`, it is checked before the `403` checks; it discloses
          nothing new, because every member can see the assignees of every
          task.
        - The last assignee can be removed; the task is then unassigned. The
          task's state is not changed.
        - Once a Project Participant is no longer an assignee of any task,
          the Project Owner can remove them from the project
          ([US-019](docs/user-stories.md#us-019--unassign-a-member),
          acceptance criterion 2;
          [Assumption A-009](docs/constraints.md#assumptions)).
        - Assignees of tasks in a Completed project cannot be changed
          ([EX-022](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-011](docs/constraints.md#assumptions)).
      responses:
        '200':
          description: |
            The person is no longer an assignee of the task; the updated task
            is returned
            ([US-019](docs/user-stories.md#us-019--unassign-a-member),
            [US-020](docs/user-stories.md#us-020--assign-or-unassign-myself)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                ownerUnassignsRui:
                  summary: US-019 AC1 — the Project Owner unassigns Rui; only Ana remains
                  value:
                    taskId: '8c1f5e3a'
                    projectId: '7f3a9c1e'
                    title: Prepare budget
                    state: IN_PROGRESS
                    priority: HIGH
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
                participantUnassignsThemselves:
                  summary: US-020 AC2 — Rui unassigns himself; only Ana remains
                  value:
                    taskId: '9d07c3f5'
                    projectId: '7f3a9c1e'
                    title: Review proposal
                    state: IN_PROGRESS
                    priority: HIGH
                    assignees:
                      - personId: 'c95e0a27'
                        displayName: Ana Silva
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The person is a Project Participant and tried to remove another
            assignee; the assignees are unchanged
            ([EX-021](docs/user-stories.md#edge-cases-and-exceptions);
            [Assumption A-020](docs/constraints.md#assumptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unassignsSomeoneElse:
                  summary: EX-021 — Project Participant Rui tries to unassign Ana
                  value:
                    title: Forbidden
                    status: 403
                    detail: A Project Participant can unassign only themselves.
        '404':
          description: |
            The project or task does not exist, is deleted, or is not
            accessible to the signed-in person, or `personId` is not an
            assignee of the task; the assignees are unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  summary: Unknown, deleted, or inaccessible project or task, or not an assignee
                  value:
                    title: Not Found
                    status: 404
                    detail: The project, task, or assignee does not exist or is not accessible.
        '409':
          $ref: '#/components/responses/ProjectCompleted'
          description: |
            The project is Completed, so the task's assignees cannot be
            changed; they are unchanged
            ([EX-022](docs/user-stories.md#edge-cases-and-exceptions)).
  /projects/{projectId}/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      operationId: listTaskComments
      summary: List the comments on a task
      description: |
        Returns the comments on a task of an accessible project, oldest
        first, each with its author's display name and the date and time it
        was added.

        **Traceability:**
        [FR-021](docs/requirements.md#functional-requirements);
        [US-022](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-022--read-comments);
        access rules from
        [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Every member may read the comments, also in a Completed project
          ([Assumption A-023](docs/constraints.md#assumptions);
          [OQ-024](docs/constraints.md#open-questions)).
        - Order: oldest first, by the date and time each comment was added
          ([US-022](docs/user-stories.md#us-022--read-comments);
          [Assumption A-023](docs/constraints.md#assumptions)).
        - Comments are never edited or deleted
          ([Assumption A-023](docs/constraints.md#assumptions)). A comment
          whose author is no longer a member of the project is still listed
          with that author (proposal of this draft), and comments on a
          deleted task are hidden with it
          ([Assumption A-022](docs/constraints.md#assumptions)).
        - An empty list is a successful response: the client then says that
          there are no comments yet
          ([US-022](docs/user-stories.md#us-022--read-comments), acceptance
          criterion 2).
        - Comment texts may contain personal data
          ([OQ-011](docs/constraints.md#open-questions)).
      responses:
        '200':
          description: The comments on the task, oldest first, possibly none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
              examples:
                firstAndSecond:
                  summary: US-022 AC1 — "First" by Ana, then "Second" by Rui
                  value:
                    - commentId: 'f2c8a4b6'
                      taskId: '9d07c3f5'
                      author:
                        personId: 'c95e0a27'
                        displayName: Ana Silva
                      createdAt: '2026-10-29T09:30:00Z'
                      text: First
                    - commentId: 'd7e9b1c3'
                      taskId: '9d07c3f5'
                      author:
                        personId: '3e7b5a90'
                        displayName: Rui Martins
                      createdAt: '2026-10-29T10:05:00Z'
                      text: Second
                noComments:
                  summary: US-022 AC2 — the task has no comments yet
                  value: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    post:
      tags: [Comments]
      operationId: addTaskComment
      summary: Add a comment to a task
      description: |
        Adds a comment with nonempty text to a task of an accessible project.
        The signed-in person is its author, and the date and time it was
        added are recorded.

        **Traceability:**
        [FR-020](docs/requirements.md#functional-requirements);
        [US-021](docs/user-stories.md#stories) and its
        [acceptance criteria](docs/user-stories.md#us-021--add-comment);
        [EX-023](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-024](docs/user-stories.md#edge-cases-and-exceptions); access
        rules from [EX-003](docs/user-stories.md#edge-cases-and-exceptions),
        [EX-012](docs/user-stories.md#edge-cases-and-exceptions),
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria),
        and
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria).

        **Rules (proposed, not client-approved):**
        - Any member may add comments, whether Project Owner or Project
          Participant and whether or not they are an assignee, so there is
          no `403` ([Assumption A-001](docs/constraints.md#assumptions),
          [Assumption A-023](docs/constraints.md#assumptions);
          [OQ-024](docs/constraints.md#open-questions)).
        - Comments can also be added while the project is Completed, an
          explicit exception to its being read-only, so there is no `409`;
          the project's other information is unchanged
          ([EX-024](docs/user-stories.md#edge-cases-and-exceptions);
          [Assumption A-011](docs/constraints.md#assumptions),
          [Assumption A-023](docs/constraints.md#assumptions)).
        - The text is required and nonempty; an empty text adds no comment
          and returns `422` with an error for `/text`
          ([EX-023](docs/user-stories.md#edge-cases-and-exceptions)). Length
          limits and whitespace-only text are open
          ([OQ-024](docs/constraints.md#open-questions)) and are not
          enforced.
        - The author is the signed-in person and the date and time are
          recorded by Matriz; neither can be chosen
          ([Assumption A-023](docs/constraints.md#assumptions)).
        - A comment cannot be edited or deleted, and no notification is sent
          ([Assumption A-023](docs/constraints.md#assumptions)).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
            examples:
              draftSent:
                summary: US-021 — Ana adds "Draft sent to the client"
                value:
                  text: Draft sent to the client
              completedProject:
                summary: EX-024 — a member comments on a task of a Completed project
                value:
                  text: Final report approved by the team
      responses:
        '201':
          description: |
            The comment was added, with the signed-in person as author and
            the date and time it was added
            ([US-021](docs/user-stories.md#us-021--add-comment)).
          headers:
            Location:
              description: |
                URI reference of the created comment. This draft defines no
                operation on that URI; comments are read with
                `listTaskComments`.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /api/projects/7f3a9c1e/tasks/9d07c3f5/comments/6b1d9f40
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                draftSent:
                  summary: US-021 — the comment shows Ana's display name and when it was added
                  value:
                    commentId: '6b1d9f40'
                    taskId: '9d07c3f5'
                    author:
                      personId: 'c95e0a27'
                      displayName: Ana Silva
                    createdAt: '2026-10-29T11:15:00Z'
                    text: Draft sent to the client
                completedProject:
                  summary: EX-024 — the comment is added although the project is Completed
                  value:
                    commentId: 'b8f3d2a6'
                    taskId: '5a9e1c74'
                    author:
                      personId: 'c95e0a27'
                      displayName: Ana Silva
                    createdAt: '2026-10-29T16:40:00Z'
                    text: Final report approved by the team
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '422':
          description: |
            The content does not satisfy `CreateCommentRequest`: it is not a
            JSON object, `text` is missing, empty, or not a string, or
            another property is present. No comment is added, and `errors`
            identifies each invalid member
            ([EX-023](docs/user-stories.md#edge-cases-and-exceptions)).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                emptyText:
                  summary: 'EX-023 — response to {"text": ""}'
                  value:
                    title: Unprocessable Content
                    status: 422
                    detail: Comment text is required.
                    errors:
                      - pointer: /text
                        detail: Text is required.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Signed JWT access token issued by `signIn` and sent with every other
        request in the `Authorization` header with the `Bearer` scheme
        (RFC 6750), a provisional team decision
        ([ADR-005](docs/adr/ADR-005-authentication-with-jwt.md)). Clients
        treat the token as opaque. It lasts 8 hours from `signIn`, with no
        idle timeout and no renewal, and it is refused once it has expired or
        after `signOut` (team decisions of 2026-11-02, Lab Worksheet 03,
        questions 2, 3, and 5; previously “its lifetime is open (OQ-027)”).
        The server signs tokens with HS256; a token's header holds only `alg`
        and `typ`, and its claims are exactly `sub` (the person's
        identifier), `jti`, `iat`, and `exp`
        ([ADR-005](docs/adr/ADR-005-authentication-with-jwt.md#open-points),
        question 17). Clients must not depend on this content. See the token
        life cycle in the description of this contract.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identifier of the project.
      schema:
        $ref: '#/components/schemas/Identifier'
    TaskId:
      name: taskId
      in: path
      required: true
      description: Identifier of a task belonging to the project.
      schema:
        $ref: '#/components/schemas/Identifier'
    PersonId:
      name: personId
      in: path
      required: true
      description: Identifier of a person.
      schema:
        $ref: '#/components/schemas/Identifier'
  headers:
    WWWAuthenticate:
      description: |
        Bearer challenge (RFC 6750): `Bearer` when no token was sent, and
        `Bearer error="invalid_token"` when the token is malformed, invalid,
        expired, or no longer accepted. The `401` of `signIn` carries
        `Bearer`, because it concerns no token. The challenge has no
        `error_description`.
      required: true
      schema:
        type: string
      examples:
        noToken:
          summary: No token was sent
          value: Bearer
        invalidToken:
          summary: The token is malformed, invalid, expired, or no longer accepted
          value: 'Bearer error="invalid_token"'
  responses:
    UnsupportedMediaType:
      description: |
        The request content is not in the operation's media type, for example
        JSON sent as `text/plain`; nothing is changed
        ([ADR-004](docs/adr/ADR-004-rest-api-single-entry-point.md)).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            wrongMediaType:
              summary: The request content is not in the operation's media type
              value:
                title: Unsupported Media Type
                status: 415
                detail: The request content must be in the operation's media type.
    BadRequest:
      description: |
        The request content is absent or is not well-formed JSON, or a query
        parameter value is invalid; nothing is changed. Content that is not
        in the operation's media type receives `415` instead. Well-formed content that does not satisfy the
        request schema receives `422` instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformedJson:
              summary: The request content is not well-formed JSON
              value:
                title: Bad Request
                status: 400
                detail: The request content is not well-formed JSON.
            emptySearchText:
              summary: Response to ?name= (empty search text)
              value:
                title: Bad Request
                status: 400
                detail: The query parameter name must not be empty.
            badPage:
              summary: Response to ?page=0 or ?size=101 (out of range)
              value:
                title: Bad Request
                status: 400
                detail: The query parameter size must be an integer from 1 to 100.
            labelInsteadOfCode:
              summary: Response to ?state=Done, a label instead of a code
              value:
                title: Bad Request
                status: 400
                detail: The query parameter state must be TO_DO, IN_PROGRESS, or DONE.
    Unauthorized:
      description: |
        The person's identity has not been established: no token was sent,
        or the token is malformed, invalid, expired, or no longer accepted
        after `signOut`. No information is disclosed and nothing is changed
        ([EX-012](docs/user-stories.md#edge-cases-and-exceptions);
        [NFR-001](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
        [Assumption A-014](docs/constraints.md#assumptions);
        [ADR-005](docs/adr/ADR-005-authentication-with-jwt.md)). The User
        interface then discards the token and asks the person to sign in
        again ([ADR-009](docs/adr/ADR-009-identity-from-the-token.md),
        decision 1; added on 2026-11-02).
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            identityNotEstablished:
              summary: EX-012 — no token was sent
              value:
                title: Unauthorized
                status: 401
                detail: Identity has not been established.
            invalidToken:
              summary: The token is invalid, expired, or no longer accepted
              value:
                title: Unauthorized
                status: 401
                detail: The access token is invalid, expired, or no longer accepted.
    ProjectNotFound:
      description: |
        The project does not exist, is deleted, or the person is not a member
        of it. All cases receive the same response, so nothing about the
        project is disclosed; nothing is changed
        ([EX-003](docs/user-stories.md#edge-cases-and-exceptions);
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
        [Assumption A-002](docs/constraints.md#assumptions),
        [Assumption A-022](docs/constraints.md#assumptions)).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            projectNotAccessible:
              summary: EX-003 — not a member, deleted, or no such project
              value:
                title: Not Found
                status: 404
                detail: The project does not exist or is not accessible.
    TaskNotFound:
      description: |
        The project does not exist, is deleted, or the person is not a member
        of it, or no task with `taskId` that is not deleted belongs to the
        project. A non-member receives this response whether or not the
        project or task exists, so nothing is disclosed; nothing is changed
        ([EX-003](docs/user-stories.md#edge-cases-and-exceptions);
        [NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria);
        [Assumption A-002](docs/constraints.md#assumptions),
        [Assumption A-022](docs/constraints.md#assumptions)).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            taskNotAccessible:
              summary: EX-003 — not a member, deleted, or no such project or task
              value:
                title: Not Found
                status: 404
                detail: The project or task does not exist or is not accessible.
    NotProjectOwner:
      description: |
        The person is a member of the project but not its Project Owner;
        nothing is changed
        ([Assumption A-001](docs/constraints.md#assumptions);
        [permission matrix](docs/requirements.md#permission-matrix-proposed)).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notProjectOwner:
              summary: A Project Participant tries what only the Project Owner may do
              value:
                title: Forbidden
                status: 403
                detail: Only the Project Owner of this project can do this.
    ProjectCompleted:
      description: |
        The project is Completed, so neither it nor its members, tasks, or
        assignments can be changed; nothing is changed
        ([Assumption A-011](docs/constraints.md#assumptions)). Comments are
        the only exception
        ([Assumption A-023](docs/constraints.md#assumptions)). Whether a
        Completed project can be reopened is open
        ([OQ-006](docs/constraints.md#open-questions)).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            projectCompleted:
              summary: The project is Completed
              value:
                title: Conflict
                status: 409
                detail: The project is Completed; it cannot be changed.
  schemas:
    Identifier:
      type: string
      minLength: 1
      description: |
        Opaque identifier assigned by Matriz, with no business meaning,
        because names and titles can change
        ([data model](docs/database.md#entities)). Its format is not decided;
        clients must not derive anything from it.
    ProjectName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Required project name: after trimming, 1 to 100 characters, counted as
        Unicode characters ([Assumption A-003](docs/constraints.md#assumptions),
        [Assumption A-031](docs/constraints.md#assumptions)). The service trims
        the text before it checks the length, so a request name of only
        whitespace receives `422`. Names are not unique
        ([OQ-003](docs/constraints.md#open-questions)).
    ProjectDescription:
      type: string
      maxLength: 1000
      description: |
        Optional project description of at most 1000 characters, counted as
        Unicode characters and trimmed by the service; one that is empty after
        trimming means no description
        ([Assumption A-031](docs/constraints.md#assumptions);
        [OQ-028](docs/constraints.md#open-questions)).
    TaskTitle:
      type: string
      minLength: 1
      maxLength: 150
      description: |
        Required task title: after trimming, 1 to 150 characters, counted as
        Unicode characters ([Assumption A-004](docs/constraints.md#assumptions),
        [Assumption A-031](docs/constraints.md#assumptions)). The service trims
        the text before it checks the length, so a title of only whitespace,
        including no-break spaces, receives `422`. Whether titles must be
        unique is open ([OQ-003](docs/constraints.md#open-questions)); they
        are not.
    TaskDescription:
      type: string
      maxLength: 2000
      description: |
        Optional task description of at most 2000 characters, counted as
        Unicode characters and trimmed by the service; one that is empty after
        trimming means no description
        ([Assumption A-033](docs/constraints.md#assumptions);
        [OQ-030](docs/constraints.md#open-questions)).
    CommentText:
      type: string
      minLength: 1
      description: |
        Required, nonempty comment text
        ([Assumption A-023](docs/constraints.md#assumptions)). Whether
        whitespace-only text is accepted and any length limits are open
        ([OQ-024](docs/constraints.md#open-questions)); this draft enforces
        neither. The text may contain personal data
        ([OQ-011](docs/constraints.md#open-questions)).
    DisplayName:
      type: string
      minLength: 1
      description: |
        The name by which a person is shown to the other members of their
        projects ([glossary](docs/requirements.md#glossary);
        [Assumption A-017](docs/constraints.md#assumptions)). It is personal
        data ([OQ-011](docs/constraints.md#open-questions)). Clients identify
        people by `personId`; this draft does not require display names to be
        unique.
    LoginName:
      type: string
      minLength: 1
      description: |
        The unique name a person enters to sign in
        ([glossary](docs/requirements.md#glossary);
        [Assumption A-017](docs/constraints.md#assumptions)). It is sent only
        to `signIn` and is never returned by any operation (proposal of this
        draft). It is compared ignoring letter case: Matriz keeps login names
        in lower case (team decision of 2026-11-02, Lab Worksheet 03,
        question 10).
    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      description: |
        The person's password, sent only to `signIn` and never returned;
        Matriz keeps only a hash of it
        ([Assumption A-017](docs/constraints.md#assumptions)). `signIn`
        requires only a nonempty value; a wrong password, including one
        longer than 72 bytes in UTF-8, receives `401`. The password rules,
        at least 15 characters and at most 72 bytes in UTF-8, apply to the
        passwords of the prepared demonstration accounts, which are checked
        when the server starts, because there is no registration and no
        password change. *Changed on 2026-11-02 by team decision (Lab
        Worksheet 03, question 8): previously “Password rules are open
        (OQ-027); this draft requires only a nonempty value.”*
    ProjectState:
      type: string
      enum: [ACTIVE, COMPLETED]
      description: |
        Project state ([Assumption A-003](docs/constraints.md#assumptions)).
        Each value corresponds exactly to a
        [glossary](docs/requirements.md#glossary) term:

        - `ACTIVE`: Active
        - `COMPLETED`: Completed

        A Completed project is read-only, except that comments can be added
        ([Assumption A-011](docs/constraints.md#assumptions),
        [Assumption A-023](docs/constraints.md#assumptions)); reopening is
        open ([OQ-006](docs/constraints.md#open-questions)).
    MemberRole:
      type: string
      enum: [PROJECT_OWNER, PROJECT_PARTICIPANT]
      description: |
        Per-project role ([Assumption A-001](docs/constraints.md#assumptions)).
        Each value corresponds exactly to a
        [glossary](docs/requirements.md#glossary) term:

        - `PROJECT_OWNER`: Project Owner
        - `PROJECT_PARTICIPANT`: Project Participant

        Whether these roles are correct is open
        ([OQ-002](docs/constraints.md#open-questions)).
    TaskState:
      type: string
      enum: [TO_DO, IN_PROGRESS, DONE]
      description: |
        Task state ([Assumption A-005](docs/constraints.md#assumptions)). Each
        value corresponds exactly to a [glossary](docs/requirements.md#glossary)
        term:

        - `TO_DO`: To do
        - `IN_PROGRESS`: In progress
        - `DONE`: Done

        The values are language-neutral codes, not user-facing labels; the
        client shows the labels in the user-facing language, proposed to be
        English ([Assumption A-028](docs/constraints.md#assumptions);
        [OQ-013](docs/constraints.md#open-questions)). Whether these states
        are correct is open ([OQ-004](docs/constraints.md#open-questions)).
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
      description: |
        Task priority: the importance of a task within its project, not the
        MoSCoW priority of a requirement
        ([glossary](docs/requirements.md#glossary);
        [Assumption A-021](docs/constraints.md#assumptions)). Each value
        corresponds exactly to a glossary value:

        - `LOW`: Low
        - `MEDIUM`: Medium
        - `HIGH`: High

        A new task has `MEDIUM` unless the Project Owner chooses another, and
        only the Project Owner can set or change it. Whether a Task priority
        is needed, and its values and default, are open
        ([OQ-022](docs/constraints.md#open-questions)).
    PersonSummary:
      type: object
      required: [personId, displayName]
      properties:
        personId:
          $ref: '#/components/schemas/Identifier'
          description: Identifier of the person.
        displayName:
          $ref: '#/components/schemas/DisplayName'
      description: |
        A person as shown to others: identifier and display name only. The
        login name and the password hash are never included
        ([Assumption A-017](docs/constraints.md#assumptions);
        [OQ-011](docs/constraints.md#open-questions)).
    Member:
      type: object
      required: [person, role]
      properties:
        person:
          $ref: '#/components/schemas/PersonSummary'
        role:
          $ref: '#/components/schemas/MemberRole'
      description: |
        A member of a project and their role in it
        ([glossary](docs/requirements.md#glossary);
        [Assumption A-001](docs/constraints.md#assumptions)).
    TaskCounts:
      type: object
      required: [toDo, inProgress, done]
      properties:
        toDo:
          type: integer
          minimum: 0
          description: Number of tasks that are To do.
        inProgress:
          type: integer
          minimum: 0
          description: Number of tasks that are In progress.
        done:
          type: integer
          minimum: 0
          description: Number of tasks that are Done.
      description: |
        Number of tasks of one project in each state. Deleted tasks are not
        counted, and task filters never change the counts
        ([FR-012](docs/requirements.md#functional-requirements),
        [FR-024](docs/requirements.md#functional-requirements);
        [EX-026](docs/user-stories.md#edge-cases-and-exceptions);
        [Assumption A-006](docs/constraints.md#assumptions),
        [Assumption A-022](docs/constraints.md#assumptions)).
    Progress:
      type: object
      required: [taskCounts, percentDone]
      properties:
        taskCounts:
          $ref: '#/components/schemas/TaskCounts'
        percentDone:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |
            Done tasks / all tasks × 100, rounded to the nearest whole
            number, halves up: 1 of 3 is 33, 2 of 3 is 67, and 1 of 8 is 13
            ([EX-027](docs/user-stories.md#edge-cases-and-exceptions);
            [Assumption A-026](docs/constraints.md#assumptions)). `null` when
            the project has no tasks; the client then shows "No tasks", never
            0% or 100% ([EX-005](docs/user-stories.md#edge-cases-and-exceptions);
            [Assumption A-006](docs/constraints.md#assumptions)). Because of
            rounding, 100 does not imply that every task is Done, nor 0 that
            none is; `taskCounts` gives the exact numbers.
      description: |
        Progress of one project
        ([FR-012](docs/requirements.md#functional-requirements);
        [glossary](docs/requirements.md#glossary)). What progress should
        measure is open ([OQ-005](docs/constraints.md#open-questions)).
    ProjectSummary:
      type: object
      required: [projectId, name, state, myRole]
      properties:
        projectId:
          $ref: '#/components/schemas/Identifier'
          description: Identifier of the project.
        name:
          $ref: '#/components/schemas/ProjectName'
        description:
          $ref: '#/components/schemas/ProjectDescription'
        state:
          $ref: '#/components/schemas/ProjectState'
        myRole:
          $ref: '#/components/schemas/MemberRole'
          description: The signed-in person's role in the project.
        taskCounts:
          $ref: '#/components/schemas/TaskCounts'
          description: |
            Omitted until increment I5 returns the task counts; it then
            becomes required again.
      description: |
        An accessible project as listed in My projects, with its own task
        counts by state once I5 is delivered; no totals across projects are
        given. `description` is omitted when the project has none
        ([FR-001](docs/requirements.md#functional-requirements),
        [FR-024](docs/requirements.md#functional-requirements);
        [Assumption A-025](docs/constraints.md#assumptions),
        [Assumption A-031](docs/constraints.md#assumptions)).
    ProjectPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
          description: The projects of this page, possibly none.
        page:
          type: integer
          minimum: 1
          description: Number of this page, starting at 1.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of projects in a page.
        totalItems:
          type: integer
          minimum: 0
          description: Number of projects that match, across all pages.
        totalPages:
          type: integer
          minimum: 0
          description: Number of pages; 0 when no project matches.
      description: |
        One page of My projects, ordered by name ignoring letter case, then by
        `projectId`
        ([Assumption A-032](docs/constraints.md#assumptions)).
    Project:
      type: object
      required: [projectId, name, state, myRole]
      properties:
        projectId:
          $ref: '#/components/schemas/Identifier'
          description: Identifier of the project.
        name:
          $ref: '#/components/schemas/ProjectName'
        description:
          $ref: '#/components/schemas/ProjectDescription'
        state:
          $ref: '#/components/schemas/ProjectState'
        myRole:
          $ref: '#/components/schemas/MemberRole'
          description: |
            The signed-in person's role in the project, so that the client can
            offer only the permitted actions.
        progress:
          $ref: '#/components/schemas/Progress'
          description: |
            Omitted until increment I5 returns the progress; it then becomes
            required again.
      description: |
        An accessible project with its progress once I5 is delivered.
        `description` is omitted when the project has none
        ([FR-001](docs/requirements.md#functional-requirements),
        [FR-012](docs/requirements.md#functional-requirements);
        [Assumption A-031](docs/constraints.md#assumptions)). Its members
        are returned by `listProjectMembers`, and its tasks by `listTasks`.
    TaskPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          description: The tasks of this page, possibly none.
        page:
          type: integer
          minimum: 1
          description: Number of this page, starting at 1.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of tasks in a page.
        totalItems:
          type: integer
          minimum: 0
          description: |
            Number of tasks that match the filters, across all pages; the
            count a client shows next to the list.
        totalPages:
          type: integer
          minimum: 0
          description: Number of pages; 0 when no task matches.
      description: |
        One page of the tasks of a project, oldest first, from a technical
        order that is never exposed
        ([Assumption A-032](docs/constraints.md#assumptions), as amended for
        tasks).
    Task:
      type: object
      required: [taskId, projectId, title, state, priority, assignees]
      properties:
        taskId:
          $ref: '#/components/schemas/Identifier'
          description: Identifier of the task.
        projectId:
          $ref: '#/components/schemas/Identifier'
          description: Identifier of the single project the task belongs to.
        title:
          $ref: '#/components/schemas/TaskTitle'
        description:
          $ref: '#/components/schemas/TaskDescription'
          description: Omitted when the task has no description.
        state:
          $ref: '#/components/schemas/TaskState'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignees:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PersonSummary'
          description: |
            The task's assignees, possibly none; each is a member of the
            task's project and appears at most once, identified by
            `personId` ([Assumption A-019](docs/constraints.md#assumptions);
            [OQ-025](docs/constraints.md#open-questions)). Order: by display
            name (proposal of this draft).
      description: |
        A task: it belongs to exactly one project and has zero or more
        assignees ([glossary](docs/requirements.md#glossary);
        [Assumption A-004](docs/constraints.md#assumptions),
        [Assumption A-019](docs/constraints.md#assumptions)). Changed from
        0.1.0-draft: the single `assignee` became `assignees`, and `priority`
        was added.
    Comment:
      type: object
      required: [commentId, taskId, author, createdAt, text]
      properties:
        commentId:
          $ref: '#/components/schemas/Identifier'
          description: Identifier of the comment.
        taskId:
          $ref: '#/components/schemas/Identifier'
          description: Identifier of the task the comment belongs to.
        author:
          $ref: '#/components/schemas/PersonSummary'
          description: |
            The person who added the comment; kept if they later stop being a
            member of the project.
        createdAt:
          type: string
          format: date-time
          description: Date and time the comment was added, recorded by Matriz (RFC 3339).
        text:
          $ref: '#/components/schemas/CommentText'
      description: |
        A comment on a task ([glossary](docs/requirements.md#glossary);
        [Assumption A-023](docs/constraints.md#assumptions)). It is never
        edited or deleted.
    SignInRequest:
      type: object
      required: [loginName, password]
      additionalProperties: false
      properties:
        loginName:
          $ref: '#/components/schemas/LoginName'
        password:
          $ref: '#/components/schemas/Password'
      description: Content for signing in. Any other property receives `422`.
    SignInResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, person]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: |
            Signed JWT access token, to be sent as a bearer token with every
            other request ([ADR-005](docs/adr/ADR-005-authentication-with-jwt.md)).
            Clients treat it as opaque.
        tokenType:
          type: string
          const: Bearer
          description: How the token is sent (RFC 6750).
        expiresIn:
          type: integer
          minimum: 1
          description: |
            Number of seconds until the token expires: 28800 (8 hours).
            Clients compute the expiry from their own clock when they receive
            the response, and read this value rather than assume it. *Changed
            on 2026-11-02 by team decision (Lab Worksheet 03, question 2):
            previously “The lifetime is open (OQ-027).”*
        person:
          $ref: '#/components/schemas/PersonSummary'
          description: The signed-in person.
      description: |
        Result of a successful sign-in
        ([FR-013](docs/requirements.md#functional-requirements)).
    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/ProjectName'
        description:
          oneOf:
            - $ref: '#/components/schemas/ProjectDescription'
            - type: 'null'
          description: Optional; `null` or empty after trimming means no description.
      description: |
        Content for creating a project. Only `name` and `description` are
        accepted: the project always starts Active, with its creator as
        Project Owner
        ([Assumption A-003](docs/constraints.md#assumptions),
        [Assumption A-008](docs/constraints.md#assumptions),
        [Assumption A-031](docs/constraints.md#assumptions)). Any other
        property receives `422`.
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/ProjectName'
        description:
          oneOf:
            - $ref: '#/components/schemas/ProjectDescription'
            - type: 'null'
          description: '`null` or empty after trimming removes the description.'
      description: |
        JSON Merge Patch for editing a project: `name` cannot be `null`, and
        a property that is absent is left unchanged. Any other property
        receives `422`.
    CompleteProjectRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          const: COMPLETED
          description: |
            The only state that can be set. Reopening a Completed project is
            not defined ([OQ-006](docs/constraints.md#open-questions)).
      description: Content for completing a project. Any other property receives `422`.
    AddParticipantRequest:
      type: object
      required: [personId]
      additionalProperties: false
      properties:
        personId:
          $ref: '#/components/schemas/Identifier'
          description: Identifier of the person to add, who must not yet be a member.
      description: |
        Content for adding a person as a Project Participant; the role cannot
        be chosen. Any other property receives `422`.
    CreateTaskRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/TaskTitle'
        description:
          oneOf:
            - $ref: '#/components/schemas/TaskDescription'
            - type: 'null'
          description: '`null` or empty after trimming means no description.'
        priority:
          $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM
          description: |
            Task priority of the new task; `MEDIUM` if absent
            ([Assumption A-021](docs/constraints.md#assumptions)).
      description: |
        Content for creating a task. Only `title`, `description`, and
        `priority` are accepted: the initial state is always To do
        ([Assumption A-010](docs/constraints.md#assumptions)), and assignees
        are added afterwards with `assignTask`. Any other property receives
        `422`.
    UpdateTaskRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/TaskTitle'
        description:
          oneOf:
            - $ref: '#/components/schemas/TaskDescription'
            - type: 'null'
          description: '`null` or empty after trimming removes the description.'
        priority:
          $ref: '#/components/schemas/TaskPriority'
      description: |
        JSON Merge Patch for changing a task: at least one of `title`,
        `description`, and `priority`; an absent member is unchanged. `title`
        and `priority` cannot be `null`, and
        any other property receives `422`. The state and the assignees are
        changed by other operations.
    ChangeTaskStateRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: '#/components/schemas/TaskState'
      description: The state to set. Any other property receives `422`.
    AssignTaskRequest:
      type: object
      required: [personId]
      additionalProperties: false
      properties:
        personId:
          $ref: '#/components/schemas/Identifier'
          description: |
            Identifier of the member to assign; a Project Participant can give
            only their own.
      description: Content for assigning a member to a task. Any other property receives `422`.
    CreateCommentRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          $ref: '#/components/schemas/CommentText'
      description: |
        Content for adding a comment. Only `text` is accepted: the author and
        the date and time are recorded by Matriz. Any other property receives
        `422`.
    Problem:
      type: object
      required: [title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Problem type; omitted in this draft, meaning `about:blank`.
        title:
          type: string
          description: HTTP status phrase, because `type` is `about:blank`.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: Reference identifying this occurrence; optional.
      description: |
        Problem details (RFC 9457). Additional members may appear. A problem
        never contains project, task, member, comment, or account information
        that the person may not see
        ([NFR-002](docs/requirements.md#non-functional-requirements-and-unresolved-quality-criteria)).
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                type: object
                required: [pointer, detail]
                properties:
                  pointer:
                    type: string
                    format: json-pointer
                    description: |
                      JSON Pointer (RFC 6901) to the invalid or unexpected
                      member of the request content; an empty string means
                      the whole content.
                  detail:
                    type: string
                    description: What is wrong with that member.
      description: |
        Problem details for request content that does not satisfy the request
        schema; `errors` identifies each invalid member, so the person can be
        told what is required (for example, a title:
        [EX-002](docs/user-stories.md#edge-cases-and-exceptions)).
