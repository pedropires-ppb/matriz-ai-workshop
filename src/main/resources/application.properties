# Matriz configuration (ADR-007). The database connection comes only from environment variables
# (decision 6): this file holds no credentials and no default values for them. Locally, the
# variables can be kept in .env, copied from .env.example; real environment variables and
# command-line arguments take precedence.
spring.application.name=matriz
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${MATRIZ_DB_URL}
spring.datasource.username=${MATRIZ_DB_USER}
spring.datasource.password=${MATRIZ_DB_PASSWORD}

# Flyway creates and changes the schema; Hibernate only validates it (decision 8).
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only the health check, with the status of each component and no details (decision 7).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# These loggers write each request's address, with its query string, at DEBUG or TRACE. A client
# that wrongly puts a password or an access token in the query string would have it logged, so they
# stay at INFO whatever the level of their parents (ADR-005, decision 5 and Consequences; Lab
# Worksheet 03, question 32). Setting one of these exact names to another level overrides this.
logging.level.org.springframework.security.web.FilterChainProxy=INFO
logging.level.org.springframework.security.web.access.intercept.RequestMatcherDelegatingAuthorizationManager=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO

# How long an access token lasts, with no idle timeout and no renewal (ADR-005, open point "Token
# lifetime"). The signing key comes only from the environment variable MATRIZ_JWT_SIGNING_KEY.
matriz.security.token-lifetime=8h
